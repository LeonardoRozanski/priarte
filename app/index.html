<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PriArte Ateliê · Papelaria personalizada</title>
<link id="linkManifest" rel="manifest" href="manifest.webmanifest">

<style>
  :root{
    --bg:#1d1512; --panel:#2b211c; --ink:#f3e9df; --muted:#b5a08e;
    --accent:#d4909b; --accent-soft:#4d3138; --line:#473a30;
    --on-accent:#3a2126;
    --blue:#8fb4e8; --green:#83c9a0; --amber:#dfb96f; --teal:#7fc4c4; --red:#dd8884; --gray:#9a9a9a;
    --input:#241b16;
    --radius:10px; --shadow:0 1px 4px rgba(0,0,0,.4);
  }
  body.claro{
    --bg:#f5ece3; --panel:#fffaf4; --ink:#4a3629; --muted:#9a846f;
    --accent:#b76e79; --accent-soft:#f3dfe1; --line:#e9d9ca;
    --on-accent:#ffffff;
    --blue:#4a7ab5; --green:#3d8b5f; --amber:#a5742a; --teal:#3d8b8b; --red:#b0413e; --gray:#7a7a7a;
    --input:#ffffff;
    --shadow:0 1px 4px rgba(90,60,40,.15);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header.top{background:var(--panel);border-bottom:2px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  header.top h1{font-size:1.25rem;margin:0;color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:Georgia,'Times New Roman',serif;letter-spacing:.02em}
  #logoImg{height:42px;width:42px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow)}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
  nav.tabs button{border:none;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.95rem;color:var(--muted);font-weight:600}
  nav.tabs button:hover{background:var(--accent-soft);color:var(--accent)}
  nav.tabs button.ativo{background:var(--accent);color:var(--on-accent)}
  main{max-width:1150px;margin:0 auto;padding:18px}
  section.view{display:none}
  section.view.ativa{display:block}
  .barra{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .barra h2{margin:0;font-size:1.2rem;flex:0 0 auto}
  .subtabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
  .subtabs button{border:none;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.88rem}
  .subtabs button:hover{color:var(--accent)}
  .subtabs button.ativo{background:var(--accent);color:var(--on-accent)}
  .spacer{flex:1}
  input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  input:disabled,select:disabled{opacity:.6;background:color-mix(in srgb,var(--muted) 12%,var(--input));color:var(--muted)}
  input.busca{min-width:240px}
  /* lista de sugestões própria (substitui o datalist nativo, que tem estilo bugado) */
  .sug-wrap{position:relative}
  .sug-list{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:250px;overflow:auto;background:var(--panel);border:1px solid var(--accent);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:80;display:none}
  .sug-list.aberta{display:block}
  .sug-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:none;background:transparent;color:var(--ink);text-align:left;padding:9px 12px;cursor:pointer;font-size:.92rem}
  .sug-item:hover,.sug-item.foco{background:var(--accent-soft);color:var(--accent)}
  .sug-item .preco{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;font:inherit;font-weight:600;font-size:.9rem;background:var(--accent);color:var(--on-accent);text-decoration:none}
  .btn:hover{filter:brightness(1.08)}
  .btn.sec{background:var(--accent-soft);color:var(--accent)}
  .btn.neutro{background:color-mix(in srgb,var(--muted) 15%,var(--panel));color:var(--ink)}
  .btn.perigo{background:color-mix(in srgb,var(--red) 15%,var(--panel));color:var(--red)}
  .btn.mini{padding:8px 10px;font-size:.85rem;min-height:40px}
  table.grid{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  table.grid th{background:color-mix(in srgb,var(--muted) 14%,var(--panel));text-align:left;padding:9px 10px;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  table.grid td{padding:8px 10px;border-top:1px solid var(--line);font-size:.92rem;vertical-align:top}
  table.grid tr:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-left:5px solid var(--accent)}
  .card .rotulo{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .card .valor{font-size:1.45rem;font-weight:700;margin-top:4px}
  .card .sub{font-size:.85rem;color:var(--muted)}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--bc,var(--gray));background:color-mix(in srgb,var(--bc,var(--gray)) 17%,transparent)}
  .b-aberto,.b-em_producao{--bc:var(--blue)}
  .b-aprovado,.b-entregue,.b-ok{--bc:var(--green)}
  .b-perdido,.b-semcontrole{--bc:var(--gray)}
  .b-pendente,.b-baixo{--bc:var(--amber)}
  .b-pronto{--bc:var(--teal)}
  .b-cancelado,.b-zerado{--bc:var(--red)}
  .neg{color:var(--red);font-weight:700}
  .painel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .duas-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:800px){.duas-col{grid-template-columns:1fr}}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto;padding:30px 12px}
  .overlay.aberto{display:block}
  .modal{background:var(--panel);max-width:860px;margin:0 auto;border-radius:12px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .modal h3{margin-top:0;color:var(--accent)}
  .modal .fechar{float:right;border:none;background:transparent;font-size:1.3rem;cursor:pointer;color:var(--muted)}
  .formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
  .campo{display:flex;flex-direction:column;gap:4px}
  .campo label{font-size:.8rem;font-weight:600;color:var(--muted)}
  .campo.largo{grid-column:1/-1}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .resumo-linha{display:flex;justify-content:space-between;padding:4px 0;font-size:.95rem}
  .resumo-linha.total{border-top:2px solid var(--line);font-weight:700;font-size:1.1rem;margin-top:6px;padding-top:8px}
  .muted{color:var(--muted);font-size:.85rem}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:99;display:none;box-shadow:var(--shadow)}
  #printArea{display:none}
  /* Organização para o trabalho diário e telas de toque. */
  :root{
    --radius:14px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-right:env(safe-area-inset-right,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
  }
  html{scroll-padding-top:calc(82px + var(--safe-top))}
  body{line-height:1.45}
  body.claro{--muted:#7d6858}
  button,input,select,textarea{min-width:0}
  button{touch-action:manipulation}
  button:focus-visible,.btn:focus-within,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  header.top{padding:calc(12px + var(--safe-top)) max(20px,var(--safe-right)) 12px max(20px,var(--safe-left));gap:16px;border-bottom:1px solid var(--line);flex-wrap:nowrap}
  header.top h1{font-size:1.15rem;flex-shrink:0;gap:10px;min-width:0}
  header.top h1 span{overflow:hidden;text-overflow:ellipsis;max-width:230px}
  #logoImg{height:40px;width:40px;flex-shrink:0}
  nav.tabs{flex-wrap:nowrap;gap:3px;flex:1;justify-content:center}
  nav.tabs button{min-height:44px;padding:9px 11px;font-size:.87rem;display:flex;align-items:center;justify-content:center;gap:7px}
  nav.tabs button svg{display:none}
  .icone{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .config-mobile{display:none}
  .config-mobile{color:var(--muted)}
  #btnSync{flex-shrink:0;white-space:nowrap}
  main{max-width:1280px;padding:28px max(24px,var(--safe-right)) calc(40px + var(--safe-bottom)) max(24px,var(--safe-left))}
  .barra{gap:12px;margin-bottom:20px}
  .barra h2{font-size:1.55rem;letter-spacing:-.03em}
  .barra .busca{width:280px;min-width:0}
  input,select,textarea{min-height:44px;font-size:16px;max-width:100%}
  input[type=checkbox]{min-height:20px;width:20px;height:20px;accent-color:var(--accent)}
  .campo{min-width:0;gap:6px}
  .campo label{font-size:.85rem;color:var(--ink);font-weight:500}
  .campo small{font-size:.8rem;color:var(--muted)}
  .formgrid{gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));margin-bottom:18px}
  .cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
  .card{border:1px solid var(--line);border-left:3px solid var(--accent);padding:18px;min-width:0}
  .card .rotulo{font-size:.85rem;text-transform:none;letter-spacing:0}
  .card .valor{font-size:1.85rem;letter-spacing:-.04em;margin:6px 0 3px}
  .card .sub{font-size:.8rem}
  .painel{padding:22px;border:1px solid var(--line)}
  .painel h3{font-size:1.08rem;margin:0 0 18px}
  .painel h4{font-size:.95rem;margin:24px 0 12px}
  .duas-col{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:22px}
  .painel-titulo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .painel-titulo h3{margin:0}
  .link-acao{border:0;background:none;color:var(--accent);font:inherit;font-size:.85rem;cursor:pointer;padding:10px 0;min-height:44px;flex-shrink:0}
  .lista-trabalhos{display:grid}
  .trabalho{display:flex;align-items:center;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:16px 0;text-align:left;font:inherit;cursor:pointer}
  .trabalho:hover .trabalho-nome{color:var(--accent)}
  .trabalho-info{display:grid;gap:4px;flex:1;min-width:0}
  .trabalho-nome{font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
  .trabalho-info .muted{font-size:.8rem}
  .trabalho-fim{display:grid;justify-items:end;gap:7px;flex-shrink:0;font-size:.85rem}
  .vazio{padding:26px 8px;text-align:center;color:var(--muted);font-size:.9rem}
  .vazio strong{display:block;color:var(--ink);font-weight:500;margin-bottom:5px}
  .contagem{font-size:.8rem;color:var(--muted);margin:14px 0}
  table.grid{border:1px solid var(--line);box-shadow:none}
  table.grid th{font-size:.75rem;text-transform:none;letter-spacing:0;padding:14px 12px;white-space:nowrap}
  table.grid td{padding:12px;vertical-align:middle}
  .modal table.grid th{white-space:normal}
  .modal table.grid td.muted{overflow-wrap:anywhere}
  table.grid td:first-child .btn.sec{background:none;color:var(--ink);text-align:left;justify-content:flex-start;padding:6px 0;font-weight:600;white-space:normal}
  table.grid td:first-child .btn.sec:hover{color:var(--accent)}
  .acoes-celula{white-space:normal;min-width:160px}
  .acoes-celula .btn{margin:2px 0}
  .resumo-linha{gap:16px;padding:7px 0;align-items:baseline}
  .resumo-linha>:last-child{flex-shrink:0;text-align:right;max-width:65%;overflow-wrap:anywhere}
  .resumo-linha>:first-child{min-width:0;overflow-wrap:anywhere}
  .overlay{inset:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);background:none;padding:32px 16px;overscroll-behavior:contain;scroll-padding-block:20px}
  .overlay::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:-1}
  .modal{padding:0;overflow-wrap:anywhere;width:100%;display:flex;flex-direction:column;max-height:calc(100vh - var(--safe-top) - var(--safe-bottom) - 64px);max-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 64px)}
  .modal-cabecalho{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line);flex-shrink:0}
  .modal .modal-cabecalho h3{font-size:1.25rem;line-height:1.35;padding:0;margin:0;min-width:0}
  .modal .fechar{float:none;width:44px;height:44px;margin:0;border-radius:50%;flex-shrink:0}
  .modal .fechar:hover{background:var(--accent-soft);color:var(--accent)}
  .modal-conteudo{padding:24px;overflow:auto;min-height:0;overscroll-behavior:contain;scroll-padding:16px}
  .modal-conteudo>:first-child{margin-top:0}
  .modal-conteudo>:last-child{margin-bottom:0}
  body.modal-aberto{overflow:hidden}
  .catalogo-filtros{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .catalogo-filtros .busca{flex:1;min-width:200px}
  .catalogo-filtros select{max-width:240px}
  .catalogo-resumo{display:flex;gap:10px 24px;flex-wrap:wrap;margin:0 0 20px;color:var(--muted);font-size:.9rem}
  .catalogo-resumo strong{color:var(--ink)}
  .material-nome{display:grid;gap:3px}
  .material-nome .muted{font-size:.78rem}
  .form-secao{border-top:1px solid var(--line);margin-top:24px;padding-top:20px}
  .form-secao h4{margin:0;font-size:1rem}
  .secao-titulo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .secao-titulo p{margin:4px 0 0}
  .receita-lista{display:grid;gap:12px}
  .receita-item{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px 44px;gap:14px;align-items:center;padding:16px;background:var(--input);border:1px solid var(--line);border-radius:12px;min-width:0}
  .receita-material{display:grid;gap:5px;min-width:0}

  .receita-material .btn:hover{color:var(--accent)}
  .receita-custo{display:grid;gap:6px;justify-items:end;font-size:.95rem}
  .receita-custo .muted{font-size:.8rem}
  .btn-remover{padding:8px;width:44px;min-width:44px}
  .material-busca{display:flex;gap:10px;margin-bottom:16px}
  .material-busca input{flex:1;width:100%}
  .lista-materiais-escolha{display:grid;gap:8px;margin-top:12px}
  .material-escolha{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--input);color:var(--ink);text-align:left;cursor:pointer;font:inherit;width:100%}
  .material-escolha:hover{border-color:var(--accent);background:var(--accent-soft)}
  .material-escolha-info{display:grid;gap:5px;min-width:0;overflow-wrap:anywhere}
  .material-escolha-custo{display:grid;gap:4px;text-align:right;flex-shrink:0;font-size:.9rem}
  .material-escolha .muted{font-size:.8rem}
  .resumo-produto{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:20px}

  .ficha-metricas>div{display:grid;gap:5px;padding:14px;background:var(--input);border-radius:10px;min-width:0}

<script>
'use strict';
/* ================= util ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmtBRL = v => BRL.format(Number(v)||0);
function parseNum(s){
  if(typeof s==='number') return isFinite(s)?s:0;
  s=(s||'').toString().trim(); if(!s) return 0;
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad2(n){return String(n).padStart(2,'0');}
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fmtData(iso){if(!iso)return'';const p=iso.slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600);}

/* ================= estrutura vazia; dados somente no armazenamento privado ================= */
const STORE_KEY='papelariaDBv1';
const APP_VERSAO='2026.10.09-7';
const STATUS_ORC={aberto:'Aguardando aprovação',aprovado:'Aprovado',perdido:'Não aprovado'};
const STATUS_PED={pendente:'A produzir',em_producao:'Em produção',pronto:'Pronto',entregue:'Entregue',cancelado:'Cancelado'};
const PROXIMO_PED={pendente:'em_producao',em_producao:'pronto',pronto:'entregue'};

function criarDBVazio(){
  return {
    versao:9,seq:{orcamento:1,pedido:1},
    config:{nomeLoja:'PriArte Ateliê',contato:'',salario:0,diasMes:0,horasDia:0,divisorCustoFixo:0,custosFixos:[]},
    materiais:[],produtos:[],lotes:[],orcamentos:[],pedidos:[]
  };
}

let db;
function loadDB(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){db=JSON.parse(raw);return;}}catch(e){console.warn('localStorage indisponível',e);}
  db=criarDBVazio();persistirDB();
}
function persistirDB(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(db));}catch(e){console.warn(e);}
}
function saveDB(){
  if(!aplicandoSync){
    db.rev=(db.rev||0)+1;
    db.atualizadoEm=new Date().toISOString();
  }
  persistirDB();
  if(!aplicandoSync)registrarAlteracaoSync();
}

/* Compatibilidade de formato: usa somente os dados já existentes no aparelho ou no arquivo privado. */
function migrarDB(persistir=true){
  const versaoAnterior=db.versao||1;
  const precisaMigrar=!db.lotes||versaoAnterior<9;
  if(!db.lotes)db.lotes=[];
  if(versaoAnterior<2){
    const hoje=hojeISO();
    db.materiais.forEach(m=>{
      if(m.controlaEstoque!==undefined)return;
      const unit=(m.preco!=null)?(m.preco+(m.frete||0)/(m.numItens||1))/(m.quantidade||1):(m.custoUnitario||0);
      const semControle=/^impress[ãa]o/i.test(m.nome||'');
      m.custoUnitario=unit;m.controlaEstoque=!semControle;m.estoqueMinimo=0;
      m.estoqueAtual=semControle?0:(m.quantidade||0);
      if(!semControle&&(m.quantidade||0)>0)db.lotes.push({id:uid('l'),materialId:m.id,data:hoje,quantidade:m.quantidade,qtdRestante:m.quantidade,preco:m.preco||0,frete:m.frete||0,numItens:m.numItens||1,valorUnitario:unit,fornecedor:m.fornecedor||'',obs:'Compra importada',criadoEm:new Date().toISOString()});
      delete m.preco;delete m.quantidade;delete m.frete;delete m.numItens;
    });
  }
  if(versaoAnterior<8)db.produtos.forEach(p=>{delete p.precoMarketplaceManual;delete p.baseCalculo;});
  if(versaoAnterior<9){
    const titularizar=d=>{if(!d.titulo)d.titulo=(d.itens&&d.itens.length?d.itens[0].nome:'')||'';};
    db.orcamentos.forEach(titularizar);db.pedidos.forEach(titularizar);
  }
  db.versao=9;
  if(precisaMigrar&&persistir)saveDB();
}

/* ================= cálculos ================= */
function fmtQtd(v){const n=Math.round((Number(v)||0)*100)/100;return String(n).replace('.',',');}
const UNIDADES_MATERIAL=[['Folhas','Folhas','folha'],['Unidades','Unidades','un.'],['Metros(m)','Metros (m)','m'],['Centímetros(cm)','Centímetros (cm)','cm'],['Gramas(g)','Gramas (g)','g']];
function unidadeNome(unidade){return UNIDADES_MATERIAL.find(u=>u[0]===unidade)?.[1]||unidade;}
function unidadeCurta(unidade){return UNIDADES_MATERIAL.find(u=>u[0]===unidade)?.[2]||unidade;}
/* custo unitário do material = custo médio ponderado dos lotes em estoque;
   sem estoque, usa o último lote conhecido (para a precificação não quebrar) */
function custoUnit(m){
  if(m.controlaEstoque===false)return m.custoUnitario||0;
  const lotes=db.lotes.filter(l=>l.materialId===m.id&&l.qtdRestante>0);
  const qtd=lotes.reduce((s,l)=>s+l.qtdRestante,0);
  if(qtd>0)return lotes.reduce((s,l)=>s+l.qtdRestante*l.valorUnitario,0)/qtd;
  const ult=db.lotes.filter(l=>l.materialId===m.id).sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0];
  if(ult)return ult.valorUnitario;
  return m.custoUnitario||0;
}
function valorEmEstoque(m){return (m.estoqueAtual||0)*custoUnit(m);}
function statusEstoque(m){
  if(m.controlaEstoque===false)return['semcontrole','Sem estoque físico'];
  const e=m.estoqueAtual||0;
  if(e<=0)return['zerado','Esgotado'];
  if(e<=(m.estoqueMinimo||0))return['baixo','Repor'];
  return['ok','Disponível'];
}
function materiaisEmAlerta(){return db.materiais.filter(m=>m.controlaEstoque!==false&&(m.estoqueAtual||0)<=(m.estoqueMinimo||0));}
/* consolida a necessidade de materiais de uma lista de itens (pedido/orçamento) */
function necessidadeMateriais(itens){
  const need={};
  for(const it of itens){
    if(!it.produtoId)continue;
    const p=produtoById(it.produtoId);if(!p)continue;
    for(const r of (p.itens||[])){
      const m=materialById(r.materialId);if(!m||m.controlaEstoque===false)continue;
      need[r.materialId]=(need[r.materialId]||0)+r.qtd*it.qtd;
    }
  }
  return need;
}
function faltasEstoque(itens){
  const need=necessidadeMateriais(itens);
  return Object.keys(need).map(mid=>{const m=materialById(mid);
    return {nome:m.nome,un:m.unidade,precisa:Math.round(need[mid]*100)/100,tem:Math.round((m.estoqueAtual||0)*100)/100};
  }).filter(x=>x.precisa>x.tem);
}
/* baixa FIFO: consome do lote mais antigo primeiro; guarda o rastro para estorno */
function baixarEstoque(ped){
  const need=necessidadeMateriais(ped.itens);
  ped.baixas=[];
  for(const mid of Object.keys(need)){
    const m=materialById(mid);if(!m)continue;
    let rest=need[mid];
    const lotes=db.lotes.filter(l=>l.materialId===mid&&l.qtdRestante>0).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
    for(const l of lotes){
      if(rest<=0.00001)break;
      const take=Math.min(l.qtdRestante,rest);
      l.qtdRestante=Math.round((l.qtdRestante-take)*10000)/10000;
      rest-=take;
      ped.baixas.push({materialId:mid,loteId:l.id,qtd:Math.round(take*10000)/10000});
    }
    if(rest>0.00001)ped.baixas.push({materialId:mid,loteId:null,qtd:Math.round(rest*10000)/10000});
    m.estoqueAtual=Math.round(((m.estoqueAtual||0)-need[mid])*10000)/10000;
  }
  ped.estoqueBaixado=true;
}
function estornarEstoque(ped){
  for(const b of (ped.baixas||[])){
    if(b.loteId){const l=db.lotes.find(x=>x.id===b.loteId);if(l)l.qtdRestante=Math.round((l.qtdRestante+b.qtd)*10000)/10000;}
    const m=materialById(b.materialId);if(m)m.estoqueAtual=Math.round(((m.estoqueAtual||0)+b.qtd)*10000)/10000;
  }
  ped.baixas=[];ped.estoqueBaixado=false;
}
/* quantas unidades do produto o estoque atual permite produzir */
function producivel(p){
  let min=Infinity,tem=false;
  for(const r of (p.itens||[])){
    const m=materialById(r.materialId);if(!m||m.controlaEstoque===false)continue;
    tem=true;min=Math.min(min,Math.floor((m.estoqueAtual||0)/r.qtd));
  }
  return tem?min:null;
}
function materialById(id){return db.materiais.find(m=>m.id===id);}
function produtoById(id){return db.produtos.find(p=>p.id===id);}
function valorHoraTrabalho(){const c=db.config;return c.diasMes*c.horasDia>0?c.salario/(c.diasMes*c.horasDia):0;}
function custoFixoHora(){const c=db.config;const tot=c.custosFixos.reduce((s,i)=>s+(Number(i.valor)||0),0);return c.divisorCustoFixo>0?tot/c.divisorCustoFixo:0;}
function custoProduto(p){
  const tempoH=(p.tempoMin||0)/60;
  let mat=0;const detalhe=[];
  for(const it of (p.itens||[])){
    const m=materialById(it.materialId);if(!m)continue;
    const vu=custoUnit(m);const vt=vu*it.qtd;mat+=vt;
    detalhe.push({nome:m.nome,qtd:it.qtd,un:m.unidade,vu,vt});
  }
  const maoDeObra=valorHoraTrabalho()*tempoH;
  const custoFixo=custoFixoHora()*tempoH;
  return {materiais:mat,maoDeObra,custoFixo,total:mat+maoDeObra+custoFixo,detalhe};
}
/* equação de precificação: (materiais + mão de obra + custo fixo) × (1 + lucro%) */
function precoSugerido(p){return custoProduto(p).total*(1+(p.lucroPct||0)/100);}
function precoFinal(p){return p.precoFinalManual!=null?p.precoFinalManual:precoSugerido(p);}
function lucroProduto(p){return precoFinal(p)-custoProduto(p).total;}

/* ================= navegação ================= */
let view='dashboard';
function showView(v){
  view=v;
  $$('nav.tabs button').forEach(b=>{
    b.classList.toggle('ativo',b.dataset.view===v);
    if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  $('[data-config]').classList.toggle('ativo',v==='config');
  $$('section.view').forEach(s=>s.classList.toggle('ativa',s.id==='view-'+v));
  render();
  window.scrollTo(0,0);
}
$$('nav.tabs button').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
function render(){
  $('#tituloLoja').textContent=db.config.nomeLoja||'PriArte Ateliê';
  if(view==='dashboard')renderDashboard();
  else if(view==='materiais')renderMateriais();
  else if(view==='produtos')renderProdutos();
  else if(view==='orcamentos')renderOrcamentos();
  else if(view==='pedidos')renderPedidos();
  else if(view==='config')renderConfig();
  prepararInterface($('#view-'+view));
}

function prepararInterface(raiz){
  raiz.querySelectorAll('table.grid').forEach(tabela=>{
    const cabecalho=Array.from(tabela.querySelectorAll('thead th'));
    if(!cabecalho.length)return;
    tabela.classList.add('responsive');
    tabela.querySelectorAll('tbody tr').forEach(linha=>Array.from(linha.cells).forEach((celula,i)=>{
      if(celula.colSpan>1){celula.classList.add('vazia');return;}
      const rotulo=cabecalho[i]?.textContent.trim()||'';
      celula.dataset.label=rotulo;
      if(cabecalho[i]?.classList.contains('secundaria'))celula.classList.add('secundaria');
      if(i===0)celula.classList.add('principal');
      if(!rotulo)celula.classList.add('acoes-celula');
      celula.querySelectorAll('input').forEach(input=>input.setAttribute('aria-label',rotulo+' · '+linha.cells[0].textContent.trim()));
    }));
  });
  raiz.querySelectorAll('.campo').forEach((campo,i)=>{
    const label=campo.querySelector('label'),input=campo.querySelector('input,select,textarea');
    if(!label||!input||label.contains(input))return;
    if(!input.id)input.id=raiz.id+'-campo-'+i;
    label.htmlFor=input.id;
  });
  raiz.querySelectorAll('.busca').forEach(input=>input.setAttribute('aria-label',input.placeholder));
  raiz.querySelectorAll('button').forEach(b=>{
    if(b.hasAttribute('aria-label'))return;
    if(!['✕','✖','✗','✘'].includes(b.textContent.trim()))return;
    const nome=b.closest('tr')?.cells[0]?.textContent.trim()||'';
    b.setAttribute('aria-label',(b.getAttribute('onclick')?.startsWith('excluir')?'Excluir':'Remover')+(nome?' '+nome:''));
  });
}

/* ================= modal ================= */
let focoAntesModal=null;
const pilhaModal=[];
function abrirModal(html,{empilhar=false}={}){
  const jaAberto=$('#overlay').classList.contains('aberto');
  if(!jaAberto)focoAntesModal=document.activeElement;
  const modal=$('#modal');
  if(empilhar&&jaAberto){
    pilhaModal.push({nos:Array.from(modal.childNodes),scroll:modal.querySelector('.modal-conteudo')?.scrollTop||0,foco:document.activeElement});
  }else{pilhaModal.length=0;}
  const conteudo=document.createElement('div');conteudo.className='modal-conteudo';conteudo.innerHTML=html;
  const titulo=conteudo.querySelector('h3');
  const cabecalho=document.createElement('div');cabecalho.className='modal-cabecalho';
  if(titulo){titulo.id='tituloModal';cabecalho.append(titulo);modal.setAttribute('aria-labelledby','tituloModal');}
  else{modal.removeAttribute('aria-labelledby');}
  const fechar=document.createElement('button');fechar.type='button';fechar.className='fechar';fechar.setAttribute('aria-label','Fechar janela');fechar.textContent='✕';fechar.addEventListener('click',()=>fecharModal());cabecalho.append(fechar);
  modal.replaceChildren(cabecalho,conteudo);
  prepararInterface(modal);
  $('#overlay').classList.add('aberto');document.body.classList.add('modal-aberto');
  $('#overlay').scrollTop=0;
  $('main').inert=true;$('header.top').inert=true;
  modal.focus({preventScroll:true});
}
function fecharModal(){
  if(pilhaModal.length){
    const anterior=pilhaModal.pop(),modal=$('#modal');modal.replaceChildren(...anterior.nos);
    if(modal.querySelector('h3'))modal.setAttribute('aria-labelledby','tituloModal');else modal.removeAttribute('aria-labelledby');
    const conteudo=modal.querySelector('.modal-conteudo');if(conteudo)conteudo.scrollTop=anterior.scroll;
    if(anterior.foco?.isConnected)anterior.foco.focus({preventScroll:true});else modal.focus({preventScroll:true});
    return;
  }
  $('#overlay').classList.remove('aberto');$('#modal').innerHTML='';document.body.classList.remove('modal-aberto');
  $('main').inert=false;$('header.top').inert=false;
  if(focoAntesModal?.isConnected)focoAntesModal.focus({preventScroll:true});
}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')fecharModal();});
document.addEventListener('keydown',e=>{
  if(!$('#overlay').classList.contains('aberto'))return;
  if(e.key==='Escape'){e.preventDefault();fecharModal();}
  if(e.key==='Tab'){
    const campos=Array.from($('#modal').querySelectorAll('button,input,select,textarea,a[href],summary,[tabindex="0"]')).filter(el=>!el.disabled&&el.getClientRects().length);
    const primeiro=campos[0],ultimo=campos[campos.length-1];
    if(e.shiftKey&&(document.activeElement===primeiro||document.activeElement===$('#modal'))){e.preventDefault();ultimo?.focus();}
    else if(!e.shiftKey&&document.activeElement===ultimo){e.preventDefault();primeiro?.focus();}
  }
});

/* ================= dashboard ================= */
function renderDashboard(){
  const abertos=db.orcamentos.filter(o=>o.status==='aberto');
  const ativos=db.pedidos.filter(p=>['pendente','em_producao','pronto'].includes(p.status));
  const hoje=hojeISO(),limite=new Date();limite.setDate(limite.getDate()+7);
  const limiteISO=limite.getFullYear()+'-'+pad2(limite.getMonth()+1)+'-'+pad2(limite.getDate());
  const entregas=ativos.filter(p=>p.prazo&&p.prazo>=hoje&&p.prazo<=limiteISO);
  const alertas=materiaisEmAlerta();
  const soma=a=>a.reduce((s,x)=>s+(x.total||0),0);
  $('#view-dashboard').innerHTML=`
    <div class="barra inicio"><h2>Meu ateliê</h2><div class="spacer"></div>
      <button class="btn" onclick="abrirFormDoc('orcamento')">+ Novo orçamento</button>
      <button class="btn sec" onclick="abrirFormDoc('pedido')">+ Novo pedido</button>
    </div>
    <div class="cards">
      <div class="card" style="border-left-color:var(--blue)"><div class="rotulo">Pedidos em andamento</div><div class="valor">${ativos.length}</div><div class="sub">${fmtBRL(soma(ativos))}</div></div>
      <div class="card"><div class="rotulo">Aguardando aprovação</div><div class="valor">${abertos.length}</div><div class="sub">${fmtBRL(soma(abertos))}</div></div>
      <div class="card" style="border-left-color:var(--teal)"><div class="rotulo">Próximas entregas</div><div class="valor">${entregas.length}</div><div class="sub">Até ${fmtData(limiteISO).slice(0,5)}</div></div>
      <div class="card" style="border-left-color:${alertas.length?'var(--amber)':'var(--green)'}"><div class="rotulo">Materiais para repor</div><div class="valor">${alertas.length}</div><div class="sub">${alertas.length?'Alerta de estoque':'Estoque em dia'}</div></div>
    </div>
    <div class="duas-col">
      <div class="painel"><div class="painel-titulo"><h3>Fila de produção</h3><button class="link-acao" onclick="showView('pedidos')">Ver pedidos →</button></div>${listaResumoPed()}</div>
      <div class="painel"><div class="painel-titulo"><h3>Orçamentos em aberto</h3><button class="link-acao" onclick="showView('orcamentos')">Ver todos →</button></div>${listaResumoOrc()}</div>
    </div>
    ${alertas.length?`<div class="painel"><div class="painel-titulo"><h3>Reposição de materiais</h3><button class="link-acao" onclick="abrirEstoqueMateriais()">Ver estoque →</button></div>${listaAlertas(alertas)}</div>`:''}`;
}
function listaAlertas(alertas){
  if(!alertas.length)return '<p class="muted">Estoque em dia ✓ — nenhum material abaixo do mínimo.</p>';
  return '<table class="grid"><thead><tr><th>Material</th><th>Status</th><th class="num">Estoque</th><th class="num">Mínimo</th><th></th></tr></thead><tbody>'+alertas.map(m=>{
    const[stClass,stLabel]=statusEstoque(m);
    return `<tr><td><button class="btn mini sec" onclick="abrirLotes('${m.id}')">${esc(m.nome)}</button></td>
    <td><span class="badge b-${stClass}">${stLabel}</span></td>
    <td class="num"><strong class="${(m.estoqueAtual||0)<0?'neg':''}">${fmtQtd(m.estoqueAtual||0)}</strong> ${esc(m.unidade)}</td>
    <td class="num">${fmtQtd(m.estoqueMinimo||0)}</td>
    <td class="num"><button class="btn mini sec" onclick="abrirCompra('${m.id}')">+ Compra</button></td></tr>`;
  }).join('')+'</tbody></table>';
}
function listaResumoOrc(){
  const itens=db.orcamentos.filter(o=>o.status==='aberto').sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||'')).slice(0,6);
  if(!itens.length)return '<div class="vazio"><strong>Nenhum orçamento aguardando aprovação</strong>Os novos orçamentos aparecem aqui.</div>';
  return '<div class="lista-trabalhos">'+itens.map(o=>`<button class="trabalho" onclick="verDoc('orcamento','${o.id}')"><span class="trabalho-info"><span class="trabalho-nome">${esc(o.titulo||o.numero)}</span><span class="muted">${esc(o.cliente||'Cliente não informado')} · ${esc(o.numero)}</span></span><span class="trabalho-fim"><strong>${fmtBRL(o.total)}</strong><span class="muted">${fmtData(o.data)}</span></span></button>`).join('')+'</div>';
}
function listaResumoPed(){
  const itens=db.pedidos.filter(p=>p.status!=='entregue'&&p.status!=='cancelado').sort((a,b)=>(a.prazo||'9999').localeCompare(b.prazo||'9999')).slice(0,6);
  if(!itens.length)return '<div class="vazio"><strong>Nenhum pedido em andamento</strong>Sua fila de produção está livre.</div>';
  return '<div class="lista-trabalhos">'+itens.map(p=>`<button class="trabalho" onclick="verDoc('pedido','${p.id}')"><span class="trabalho-info"><span class="trabalho-nome">${esc(p.titulo||p.numero)}</span><span class="muted">${esc(p.cliente||'Cliente não informado')} · ${esc(p.numero)}</span><span class="${p.prazo&&p.prazo<hojeISO()?'neg':'muted'}">${p.prazo?(p.prazo<hojeISO()?'Atrasado · ':p.prazo===hojeISO()?'Entrega hoje · ':'Entrega · ')+fmtData(p.prazo):'Sem prazo definido'}</span></span><span class="trabalho-fim"><span class="badge b-${p.status}">${STATUS_PED[p.status]}</span><strong>${fmtBRL(p.total)}</strong></span></button>`).join('')+'</div>';
}

/* ================= estoque / materiais ================= */
let filtroMat='',abaMat='cadastro',situacaoMat='todos';
function abrirEstoqueMateriais(){abaMat='estoque';showView('materiais');}
function trocarAbaMateriais(aba){abaMat=aba;render();}
function textoBusca(texto){return String(texto||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function renderMateriais(){
  const f=textoBusca(filtroMat.trim()),estoque=abaMat==='estoque';
  const lista=db.materiais.filter(m=>{
    if(f&&!textoBusca(m.nome+' '+(m.fornecedor||'')).includes(f))return false;
    if(!estoque||situacaoMat==='todos')return true;
    const [status]=statusEstoque(m);
    return situacaoMat==='alerta'?['baixo','zerado'].includes(status):status===situacaoMat;
  }).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base',numeric:true}));
  const controlados=db.materiais.filter(m=>m.controlaEstoque!==false),nAlertas=materiaisEmAlerta().length;
  const linhas=lista.map(m=>{
    const ctrl=m.controlaEstoque!==false,[stClass,stLabel]=statusEstoque(m),est=m.estoqueAtual||0;
    if(!estoque)return `<tr>
      <td><button class="btn mini sec" onclick="fichaMaterial('${m.id}')">${esc(m.nome)}</button></td>
      <td>${esc(unidadeNome(m.unidade))}</td><td class="num">${fmtBRL(custoUnit(m))}</td>
      <td class="muted">${esc(m.fornecedor||'Não informado')}</td>
      <td class="num"><button class="btn mini neutro" onclick="abrirFormMaterial('${m.id}')">Editar</button>
      <button class="btn mini perigo" onclick="excluirMaterial('${m.id}')">✕</button></td></tr>`;
    return `<tr>
      <td><button class="btn mini sec" onclick="fichaMaterial('${m.id}')">${esc(m.nome)}</button><div><span class="badge b-${stClass}">${stLabel}</span></div></td>
      <td class="num">${ctrl?`<strong class="${est<0?'neg':''}">${fmtQtd(est)}</strong> <span class="muted">${esc(m.unidade)}</span>`:'<span class="muted">Sem estoque físico</span>'}</td>
      <td class="num">${ctrl?fmtQtd(m.estoqueMinimo||0):'—'}</td>
      <td class="num">${fmtBRL(custoUnit(m))}</td>
      <td class="num">${ctrl?fmtBRL(valorEmEstoque(m)):'—'}</td>
      <td class="num">${ctrl?`<button class="btn mini sec" onclick="abrirCompra('${m.id}')">+ Compra</button>
      <button class="btn mini neutro" onclick="abrirAjuste('${m.id}')">Ajustar</button>`:''}
      <button class="btn mini neutro" onclick="abrirLotes('${m.id}')">Compras</button></td></tr>`;
  }).join('');
  $('#view-materiais').innerHTML=`
    <div class="barra"><h2>Materiais</h2><div class="spacer"></div><button class="btn" onclick="abrirFormMaterial()">+ Novo material</button></div>
    <div class="catalogo-resumo"><span><strong>${db.materiais.length}</strong> cadastrados</span>
      <span><strong>${nAlertas}</strong> para repor</span>${estoque?`<span>Valor em estoque: <strong>${fmtBRL(controlados.reduce((s,m)=>s+valorEmEstoque(m),0))}</strong></span>`:''}</div>
    <div class="catalogo-filtros">
      <div class="subtabs" aria-label="Visualização dos materiais">
        <button class="${estoque?'':'ativo'}" aria-pressed="${!estoque}" onclick="trocarAbaMateriais('cadastro')">Cadastro</button>
        <button class="${estoque?'ativo':''}" aria-pressed="${estoque}" onclick="trocarAbaMateriais('estoque')">Estoque</button>
      </div>
      <input class="busca" id="buscaMat" placeholder="Buscar material ou fornecedor..." value="${esc(filtroMat)}">
      ${estoque?`<select aria-label="Situação do estoque" onchange="situacaoMat=this.value;render()">${[['todos','Todos os materiais'],['alerta','Para repor'],['zerado','Esgotados'],['ok','Disponíveis'],['semcontrole','Sem estoque físico']].map(([valor,nome])=>`<option value="${valor}" ${valor===situacaoMat?'selected':''}>${nome}</option>`).join('')}</select>`:''}
    </div>
    <table class="grid"><thead><tr>${estoque?'<th>Material</th><th class="num">Disponível</th><th class="num">Mínimo</th><th class="num">Custo por unidade</th><th class="num">Valor em estoque</th><th></th>':'<th>Material</th><th>Unidade</th><th class="num">Custo por unidade</th><th>Fornecedor</th><th></th>'}</tr></thead>
    <tbody>${linhas||`<tr><td colspan="${estoque?6:5}" class="muted">${db.materiais.length?'Nenhum material corresponde à busca.':'Nenhum material cadastrado. Use “Novo material” para começar.'}</td></tr>`}</tbody></table>
    <p class="contagem">${lista.length} de ${db.materiais.length} materiais</p>`;
  const b=$('#buscaMat');b.addEventListener('input',()=>{filtroMat=b.value;render();const nb=$('#buscaMat');nb.focus();nb.setSelectionRange(nb.value.length,nb.value.length);});
}
function fichaMaterial(id){
  const m=materialById(id);if(!m)return;
  const ctrl=m.controlaEstoque!==false,[stClass,stLabel]=statusEstoque(m);
  const produtos=db.produtos.filter(p=>(p.itens||[]).some(i=>i.materialId===id));
  abrirModal(`<h3>${esc(m.nome)}</h3>
    <span class="badge b-${stClass}">${stLabel}</span>
    <div class="ficha-metricas">
      <div><span class="muted">Custo por unidade</span><strong>${fmtBRL(custoUnit(m))} / ${esc(unidadeCurta(m.unidade))}</strong></div>
      <div><span class="muted">Disponível</span><strong>${ctrl?fmtQtd(m.estoqueAtual||0)+' '+esc(m.unidade):'Sem estoque físico'}</strong></div>
    </div>
    <div class="resumo-linha"><span>Fornecedor</span><span>${esc(m.fornecedor||'Não informado')}</span></div>
    ${ctrl?`<div class="resumo-linha"><span>Estoque mínimo</span><span>${fmtQtd(m.estoqueMinimo||0)} ${esc(m.unidade)}</span></div>
    <div class="resumo-linha"><span>Valor em estoque</span><span>${fmtBRL(valorEmEstoque(m))}</span></div>`:''}
    <section class="form-secao"><h4>Usado em ${produtos.length} ${produtos.length===1?'produto':'produtos'}</h4>
      ${produtos.length?`<div class="lista-trabalhos">${produtos.map(p=>`<button class="trabalho" onclick="fichaProduto('${p.id}')"><span class="trabalho-nome">${esc(p.nome)}</span></button>`).join('')}</div>`:'<p class="muted">Ainda não está vinculado a um produto.</p>'}
    </section>
    <div class="acoes"><button class="btn" onclick="abrirFormMaterial('${id}')">Editar material</button>
      ${ctrl?`<button class="btn sec" onclick="abrirCompra('${id}')">+ Compra</button>`:''}
      <button class="btn neutro" onclick="abrirLotes('${id}')">Histórico de compras</button></div>`);
}
function abrirFormMaterial(id,opcoes={}){
  const m=id?materialById(id):{nome:opcoes.nomeInicial||'',fornecedor:'',unidade:'Folhas',controlaEstoque:true,custoUnitario:0,estoqueMinimo:0};
  if(!m)return;
  abrirModal(`<h3>${id?'Editar':'Novo'} material</h3>
  <form onsubmit="return salvarMaterial(event,'${id||''}')">
    <div class="formgrid">
      <div class="campo largo"><label>Nome do material</label><input name="nome" required value="${esc(m.nome)}"></div>
      <div class="campo largo"><label>Fornecedor padrão</label><input name="fornecedor" value="${esc(m.fornecedor||'')}"></div>
      <div class="campo"><label>Unidade</label><select name="unidade">
        ${UNIDADES_MATERIAL.map(([valor,nome])=>`<option value="${valor}" ${valor===m.unidade?'selected':''}>${nome}</option>`).join('')}
        ${UNIDADES_MATERIAL.some(u=>u[0]===m.unidade)?'':`<option value="${esc(m.unidade)}" selected>${esc(m.unidade)}</option>`}
      </select></div>
      <div class="campo"><label>Estoque mínimo</label><input name="estoqueMinimo" inputmode="decimal" value="${m.estoqueMinimo||0}"><small>Alerta de reposição ao atingir esta quantidade.</small></div>
      <div class="campo"><label>Custo de referência (R$ / unidade)</label><input name="custoUnitario" inputmode="decimal" value="${m.custoUnitario||0}"><small>Usado quando não há compras disponíveis.</small></div>
      <div class="campo largo"><label style="flex-direction:row;display:flex;align-items:center;gap:8px"><input type="checkbox" name="controlaEstoque" ${m.controlaEstoque!==false?'checked':''} style="width:auto"> Controlar estoque deste material</label></div>
    </div>
    <p class="muted">Serviços, como impressão, podem ser cadastrados sem estoque físico.</p>
    <div class="acoes"><button class="btn" type="submit">Salvar material</button><button class="btn neutro" type="button" onclick="fecharModal()">Cancelar</button></div>
  </form>`,{empilhar:!!opcoes.empilhar});
  if(opcoes.aoSalvar)$('#modal form').onsubmit=ev=>salvarMaterial(ev,id,opcoes.aoSalvar);
}
function salvarMaterial(ev,id,aoSalvar){
  ev.preventDefault();const f=ev.target;
  const dados={nome:f.nome.value.trim(),fornecedor:f.fornecedor.value.trim(),unidade:f.unidade.value.trim()||'Unidades',
    estoqueMinimo:parseNum(f.estoqueMinimo.value),custoUnitario:parseNum(f.custoUnitario.value),
    controlaEstoque:!!f.controlaEstoque.checked};
  if(!dados.nome){f.nome.value='';f.nome.reportValidity();return false;}
  let material;
  if(id){material=Object.assign(materialById(id),dados);}
  else{material=Object.assign({id:uid('m'),estoqueAtual:0},dados);db.materiais.push(material);}
  saveDB();fecharModal();render();
  if(aoSalvar)aoSalvar(material);
  toast(aoSalvar?'Material cadastrado e adicionado ao produto.':'Material salvo.');return false;
}
function excluirMaterial(id){
  const usado=db.produtos.filter(p=>(p.itens||[]).some(i=>i.materialId===id));
  if(usado.length){alert('Este material é usado nos produtos: '+usado.map(p=>p.nome).join(', ')+'.\nRemova-o dos produtos antes de excluir.');return;}
  if(!confirm('Excluir este material e seus lotes?'))return;
  db.materiais=db.materiais.filter(m=>m.id!==id);
  db.lotes=db.lotes.filter(l=>l.materialId!==id);
  saveDB();render();toast('Material excluído.');
}
/* --- compras (lotes) --- */
function abrirCompra(id){
  const m=materialById(id);if(!m)return;
  abrirModal(`<h3>Nova compra — ${esc(m.nome)}</h3>
  <form onsubmit="return salvarCompra(event,'${id}')">
    <div class="formgrid">
      <div class="campo"><label>Data</label><input name="data" type="date" value="${hojeISO()}"></div>
      <div class="campo"><label>Quantidade (${esc(m.unidade)})</label><input name="quantidade" inputmode="decimal" required placeholder="ex.: 100"></div>
      <div class="campo"><label>Valor dos materiais (R$)</label><input name="preco" inputmode="decimal" value="0"><small>Total desta compra, sem frete.</small></div>
      <div class="campo"><label>Frete da compra (R$)</label><input name="frete" inputmode="decimal" value="0"></div>
      <div class="campo"><label>Dividir o frete entre</label><input name="numItens" inputmode="numeric" value="1"><small>Tipos de material na mesma compra. Use 1 se não dividir.</small></div>
      <div class="campo"><label>Fornecedor</label><input name="fornecedor" value="${esc(m.fornecedor||'')}"></div>
      <div class="campo largo"><label>Observações</label><input name="obs" placeholder="ex.: promoção, nº da nota..."></div>
    </div>
    <p class="muted">Disponível hoje: <strong>${fmtQtd(m.estoqueAtual||0)} ${esc(m.unidade)}</strong></p>
    <div class="acoes"><button class="btn" type="submit">Registrar compra</button><button class="btn neutro" type="button" onclick="fecharModal()">Cancelar</button></div>
  </form>`);
}
function salvarCompra(ev,id){
  ev.preventDefault();const f=ev.target;const m=materialById(id);
  const qtd=parseNum(f.quantidade.value);
  if(qtd<=0){alert('Informe a quantidade.');return false;}
  const preco=parseNum(f.preco.value),frete=parseNum(f.frete.value),nI=Math.max(1,Math.round(parseNum(f.numItens.value))||1);
  const vu=Math.round(((preco+frete/nI)/qtd)*1000000)/1000000;
  db.lotes.push({id:uid('l'),materialId:id,data:f.data.value||hojeISO(),quantidade:qtd,qtdRestante:qtd,
    preco,frete,numItens:nI,valorUnitario:vu,fornecedor:f.fornecedor.value.trim(),obs:f.obs.value.trim(),
    criadoEm:new Date().toISOString()});
  m.estoqueAtual=Math.round(((m.estoqueAtual||0)+qtd)*10000)/10000;
  const forn=f.fornecedor.value.trim();if(forn)m.fornecedor=forn;
  saveDB();fecharModal();render();
  toast(`Compra registrada: +${fmtQtd(qtd)} ${m.unidade} (${fmtBRL(vu)}/un).`);return false;
}
function abrirAjuste(id){
  const m=materialById(id);if(!m)return;
  abrirModal(`<h3>Ajuste de estoque — ${esc(m.nome)}</h3>
  <form onsubmit="return salvarAjuste(event,'${id}')">
    <div class="formgrid">
      <div class="campo"><label>Estoque atual contado (${esc(m.unidade)})</label><input name="novoEstoque" inputmode="decimal" value="${m.estoqueAtual||0}"></div>
      <div class="campo largo"><label>Motivo</label><input name="motivo" placeholder="ex.: contagem física, perda, doação..."></div>
    </div>
    <p class="muted">Corrige a quantidade contada, sem alterar os custos das compras. Para adicionar uma compra, use <strong>Registrar compra</strong>.</p>
    <div class="acoes"><button class="btn" type="submit">Salvar ajuste</button><button class="btn neutro" type="button" onclick="fecharModal()">Cancelar</button></div>
  </form>`);
}
function salvarAjuste(ev,id){
  ev.preventDefault();const f=ev.target;const m=materialById(id);
  m.estoqueAtual=Math.round(parseNum(f.novoEstoque.value)*10000)/10000;
  saveDB();fecharModal();render();toast('Estoque ajustado para '+fmtQtd(m.estoqueAtual)+' '+m.unidade+'.');return false;
}
/* --- histórico de lotes --- */
function abrirLotes(id){
  const m=materialById(id);if(!m)return;
  const lotes=db.lotes.filter(l=>l.materialId===id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const linhas=lotes.length?lotes.map(l=>{
    const totalPago=(l.preco||0)+(l.frete||0)/(l.numItens||1);
    return `<tr>
      <td>${fmtData(l.data)}</td>
      <td class="num">${fmtQtd(l.quantidade)}</td>
      <td class="num"><strong>${fmtQtd(l.qtdRestante)}</strong></td>
      <td class="num">${fmtBRL(totalPago)}</td>
      <td class="num">${fmtBRL(l.valorUnitario)}</td>
      <td class="muted">${esc(l.fornecedor||'')}</td>
      <td class="muted">${esc(l.obs||'')}</td>
      <td class="num">${l.qtdRestante>=l.quantidade-0.00001?`<button class="btn mini perigo" onclick="excluirLote('${l.id}','${id}')">✕</button>`:''}</td></tr>`;
  }).join(''):'<tr><td colspan="8" class="muted">Nenhum lote registrado.</td></tr>';
  const ctrl=m.controlaEstoque!==false;
  abrirModal(`<h3>Histórico de compras · ${esc(m.nome)}</h3>
    <p>${ctrl?`Estoque atual: <strong>${fmtQtd(m.estoqueAtual||0)} ${esc(m.unidade)}</strong> · Custo médio: <strong>${fmtBRL(custoUnit(m))}</strong>`:'Material sem controle de estoque.'}</p>
    <details><summary>Dados do material</summary>
      <div class="resumo-linha"><span>Fornecedor padrão</span><span>${esc(m.fornecedor||'Não informado')}</span></div>
      <div class="resumo-linha"><span>Estoque mínimo</span><span>${fmtQtd(m.estoqueMinimo||0)} ${esc(m.unidade)}</span></div>
      ${ctrl?`<div class="resumo-linha"><span>Valor em estoque</span><span>${fmtBRL(valorEmEstoque(m))}</span></div>`:''}
    </details>
    <table class="grid"><thead><tr><th>Data</th><th class="num">Quantidade comprada</th><th class="num">Disponível</th><th class="num">Total com frete</th><th class="num">Custo por unidade</th><th>Fornecedor</th><th>Observações</th><th></th></tr></thead>
    <tbody>${linhas}</tbody></table>
    <div class="acoes">${ctrl?`<button class="btn" onclick="fecharModal();abrirCompra('${id}')">+ Nova compra</button>`:''}<button class="btn neutro" onclick="fecharModal()">Fechar</button></div>`);
}
function excluirLote(loteId,materialId){
  const l=db.lotes.find(x=>x.id===loteId);if(!l)return;
  if(l.qtdRestante<l.quantidade-0.00001){alert('Este lote já foi consumido e não pode ser excluído.');return;}
  if(!confirm('Excluir este lote? A quantidade será removida do estoque.'))return;
  const m=materialById(materialId);
  if(m)m.estoqueAtual=Math.round(((m.estoqueAtual||0)-l.qtdRestante)*10000)/10000;
  db.lotes=db.lotes.filter(x=>x.id!==loteId);
  saveDB();abrirLotes(materialId);render();toast('Lote excluído.');
}

/* ================= produtos ================= */
let filtroProd='';
function renderProdutos(){
  const f=filtroProd.toLowerCase();
  const lista=db.produtos.filter(p=>!f||p.nome.toLowerCase().includes(f)||(p.obs||'').toLowerCase().includes(f));
  $('#view-produtos').innerHTML=`
    <div class="barra"><h2>Produtos</h2>
      <input class="busca" id="buscaProd" placeholder="Buscar produto..." value="${esc(filtroProd)}">
      <div class="spacer"></div><button class="btn" onclick="abrirFormProduto()">+ Novo produto</button>
    </div>
    <table class="grid"><thead><tr><th>Produto</th><th class="num">Custo por unidade</th><th class="num">Lucro por unidade</th><th class="num">Preço de venda</th><th></th></tr></thead>
    <tbody>${lista.map(p=>{const c=custoProduto(p);return `<tr>
      <td><button class="btn mini sec" onclick="fichaProduto('${p.id}')">${esc(p.nome)}</button></td>
      <td class="num">${fmtBRL(c.total)}</td>
      <td class="num">${fmtBRL(lucroProduto(p))}</td>
      <td class="num"><strong>${fmtBRL(precoFinal(p))}</strong>${p.precoFinalManual!=null?' <span class="muted" title="Preço manual">✎</span>':''}</td>
      <td class="num"><button class="btn mini neutro" onclick="abrirFormProduto('${p.id}')">Editar</button>
      <button class="btn mini perigo" onclick="excluirProduto('${p.id}')">✕</button></td></tr>`;}).join('')||'<tr><td colspan="5" class="muted">Nenhum produto encontrado.</td></tr>'}</tbody></table>
    <p class="contagem">${lista.length} de ${db.produtos.length} produtos</p>`;
  const b=$('#buscaProd');b.addEventListener('input',()=>{filtroProd=b.value;render();const nb=$('#buscaProd');nb.focus();nb.setSelectionRange(nb.value.length,nb.value.length);});
}
function fichaProduto(id){
  const p=produtoById(id);if(!p)return;
  const c=custoProduto(p);
  const linhas=c.detalhe.length?c.detalhe.map(d=>`<tr><td>${esc(d.nome)}</td><td class="num">${d.qtd} ${esc(d.un)}</td><td class="num">${fmtBRL(d.vu)}</td><td class="num">${fmtBRL(d.vt)}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">Nenhum material vinculado a este produto.</td></tr>';
  const prod=producivel(p);
  abrirModal(`<h3>${esc(p.nome)}</h3>
    ${p.obs?`<p class="muted">${esc(p.obs)}</p>`:''}
    ${prod!=null?`<p class="${prod<=0?'neg':'muted'}">📦 Com o estoque atual dá para produzir <strong>${prod} un</strong></p>`:''}
    <table class="grid"><thead><tr><th>Material</th><th class="num">Quantidade</th><th class="num">Custo por unidade</th><th class="num">Custo</th></tr></thead><tbody>${linhas}</tbody></table>
    <div style="margin-top:12px">
      <div class="resumo-linha"><span>Materiais</span><span>${fmtBRL(c.materiais)}</span></div>
      <div class="resumo-linha"><span>Tempo de trabalho · ${p.tempoMin||0} min</span><span>${fmtBRL(c.maoDeObra)}</span></div>
      <div class="resumo-linha"><span>Despesas do ateliê</span><span>${fmtBRL(c.custoFixo)}</span></div>
      <div class="resumo-linha total"><span>Custo total</span><span>${fmtBRL(c.total)}</span></div>
      <div class="resumo-linha"><span>Lucro por unidade</span><span>${fmtBRL(lucroProduto(p))}</span></div>
      <div class="resumo-linha total"><span>Preço de venda${p.precoFinalManual!=null?' (definido por você)':''}</span><span>${fmtBRL(precoFinal(p))}</span></div>
    </div>
    <div class="acoes"><button class="btn sec" onclick="fecharModal();abrirFormProduto('${p.id}')">Editar produto</button><button class="btn neutro" onclick="fecharModal()">Fechar</button></div>`);
}
let formProd=null;
function abrirFormProduto(id){
  const p=id?produtoById(id):{nome:'',obs:'',tempoMin:0,lucroPct:50,itens:[],precoFinalManual:null};
  formProd={id:id||null,nome:p.nome,obs:p.obs,tempoMin:p.tempoMin,lucroPct:p.lucroPct,precoFinalManual:p.precoFinalManual,itens:(p.itens||[]).map(i=>({materialId:i.materialId,qtd:i.qtd}))};
  desenharFormProduto();
}
function desenharFormProduto(){
  const fp=formProd;
  abrirModal(`<h3>${fp.id?'Editar':'Novo'} produto</h3>
  <form onsubmit="return salvarProduto(event)">
    <div class="formgrid">
      <div class="campo largo"><label>Nome do produto</label><input name="nome" required value="${esc(fp.nome)}" oninput="formProd.nome=this.value"></div>
      <div class="campo largo"><label>Observações</label><textarea name="obs" rows="2" oninput="formProd.obs=this.value">${esc(fp.obs)}</textarea></div>
    </div>
    <section class="form-secao">
      <div class="secao-titulo"><div><h4>Materiais</h4><p class="muted">Quantidades para produzir 1 unidade.</p></div>
        <button type="button" class="btn sec" onclick="addItemReceita()">+ Adicionar material</button></div>
      <div class="receita-lista" id="tbReceita"></div>
    </section>
    <section class="form-secao">
      <div class="secao-titulo"><h4>Tempo e preço</h4></div>
      <div class="formgrid">
      <div class="campo"><label>Tempo por unidade (min)</label><input name="tempoMin" inputmode="numeric" value="${fp.tempoMin}" oninput="formProd.tempoMin=parseNum(this.value);previewProduto()"></div>
      <div class="campo"><label>Lucro sobre o custo (%)</label><input name="lucroPct" inputmode="decimal" value="${fp.lucroPct}" oninput="formProd.lucroPct=parseNum(this.value);previewProduto()"></div>
      <div class="campo largo"><label>Preço de venda (opcional)</label><input name="precoFinalManual" inputmode="decimal" placeholder="Usar preço calculado" value="${fp.precoFinalManual==null?'':fp.precoFinalManual}" oninput="formProd.precoFinalManual=this.value.trim()?parseNum(this.value):null;previewProduto()"><small>Em branco, usa o preço calculado.</small></div>
      </div>
      <div class="resumo-produto" id="previewProd" aria-live="polite"></div>
    </section>
    <div class="acoes"><button class="btn" type="submit">Salvar produto</button><button class="btn neutro" type="button" onclick="fecharModal()">Cancelar</button></div>
  </form>`);
  desenharReceitaProduto();previewProduto();
}
function desenharReceitaProduto(){
  const fp=formProd,lista=$('#tbReceita');if(!lista)return;
  lista.innerHTML=fp.itens.map((it,idx)=>{
    const m=materialById(it.materialId);
    return `<div class="receita-item">
      <div class="receita-material"><button type="button" class="btn sec" onclick="abrirBuscaMaterial(${idx})" aria-label="Trocar material: ${esc(m?.nome||'não selecionado')}">${esc(m?.nome||'Escolher material')}</button>
        <small class="muted">${m?fmtBRL(custoUnit(m))+' / '+esc(unidadeCurta(m.unidade)):'Selecione um material cadastrado.'}</small></div>
      <div class="campo receita-quantidade"><label>Quantidade${m?' ('+esc(unidadeCurta(m.unidade))+')':''}</label><input data-idx="${idx}" class="inpQtd" inputmode="decimal" value="${esc(String(it.qtd??1).replace('.',','))}" aria-label="Quantidade de ${esc(m?.nome||'material')}"></div>
      <div class="receita-custo"><span class="muted">Custo</span><strong class="receita-subtotal">${m?fmtBRL(custoUnit(m)*it.qtd):'—'}</strong></div>
      <button type="button" class="btn mini perigo btn-remover" onclick="remItemReceita(${idx})" aria-label="Remover ${esc(m?.nome||'material')} do produto">✕</button>
    </div>`;
  }).join('')||'<div class="vazio"><strong>Nenhum material adicionado</strong>Selecione um material ou cadastre um novo.</div>';
  prepararInterface(lista);
  $$('.inpQtd').forEach(inp=>inp.addEventListener('input',()=>{
    const item=fp.itens[+inp.dataset.idx];item.qtd=parseNum(inp.value);
    const material=materialById(item.materialId);
    inp.closest('.receita-item').querySelector('.receita-subtotal').textContent=material?fmtBRL(custoUnit(material)*item.qtd):'—';
    previewProduto();
  }));
}
function vincularMaterialProduto(materialId,idx){
  if(idx==null){formProd.itens.push({materialId,qtd:1});idx=formProd.itens.length-1;}
  else{formProd.itens[idx].materialId=materialId;}
  desenharReceitaProduto();previewProduto();
  $(`#tbReceita .inpQtd[data-idx="${idx}"]`)?.focus();
}
function abrirBuscaMaterial(idx=null){
  abrirModal(`<h3>${idx==null?'Adicionar':'Trocar'} material</h3>
    <form onsubmit="return false">
      <div class="material-busca"><input id="buscaMaterialProduto" aria-label="Buscar material" placeholder="Buscar material ou fornecedor..." autocomplete="off">
        <button class="btn" type="button" id="novoMaterialProduto">+ Novo material</button></div>
      <p class="contagem" id="contagemMaterialProduto" aria-live="polite"></p>
      <div class="lista-materiais-escolha" id="listaMaterialProduto"></div>
      <div class="acoes"><button class="btn neutro" type="button" onclick="fecharModal()">Voltar ao produto</button></div>
    </form>`,{empilhar:true});
  const busca=$('#buscaMaterialProduto'),lista=$('#listaMaterialProduto');
  function listar(){
    const termo=textoBusca(busca.value.trim());
    const materiais=db.materiais.filter(m=>!termo||textoBusca(m.nome+' '+(m.fornecedor||'')).includes(termo)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'}));
    $('#contagemMaterialProduto').textContent=materiais.length+' de '+db.materiais.length+' materiais';
    lista.innerHTML=materiais.map(m=>`<button type="button" class="material-escolha" data-material-id="${esc(m.id)}">
      <span class="material-escolha-info"><strong>${esc(m.nome)}</strong><span class="muted">${esc(m.fornecedor||unidadeNome(m.unidade))}</span></span>
      <span class="material-escolha-custo"><strong>${fmtBRL(custoUnit(m))}</strong><span class="muted">por ${esc(unidadeCurta(m.unidade))}</span></span></button>`).join('')||'<div class="vazio"><strong>Nenhum material encontrado</strong>Use “Novo material” para cadastrar e adicionar ao produto.</div>';
  }
  lista.addEventListener('click',ev=>{
    const botao=ev.target.closest('[data-material-id]');if(!botao)return;
    fecharModal();vincularMaterialProduto(botao.dataset.materialId,idx);
  });
  busca.addEventListener('input',listar);
  busca.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();lista.querySelector('button')?.click();}});
  $('#novoMaterialProduto').addEventListener('click',()=>abrirFormMaterial(null,{nomeInicial:busca.value.trim(),empilhar:true,aoSalvar:m=>{fecharModal();vincularMaterialProduto(m.id,idx);}}));
  listar();
}
function addItemReceita(){abrirBuscaMaterial();}
function remItemReceita(idx){formProd.itens.splice(idx,1);desenharReceitaProduto();previewProduto();}
function previewProduto(){
  const el=$('#previewProd');if(!el)return;
  const c=custoProduto(formProd);
  const sug=c.total*(1+(formProd.lucroPct||0)/100);
  el.innerHTML=`<div class="resumo-linha"><span>Materiais</span><span>${fmtBRL(c.materiais)}</span></div>
  <div class="resumo-linha"><span>Trabalho e despesas · ${formProd.tempoMin||0} min</span><span>${fmtBRL(c.maoDeObra+c.custoFixo)}</span></div>
  <div class="resumo-linha total"><span>Custo total</span><span>${fmtBRL(c.total)}</span></div>
  <div class="resumo-linha"><span>Preço calculado</span><span>${fmtBRL(sug)}</span></div>
  <div class="resumo-linha total"><span>Preço de venda</span><span>${fmtBRL(precoFinal(formProd))}</span></div>`;
}
function salvarProduto(ev){
  ev.preventDefault();const f=ev.target;
  if(!f.nome.value.trim()){f.nome.value='';f.nome.reportValidity();return false;}
  if(formProd.itens.some(i=>!materialById(i.materialId)||i.qtd<=0)){alert('Selecione um material e informe uma quantidade maior que zero em cada linha.');return false;}
  const itens=formProd.itens.filter(i=>i.materialId&&i.qtd>0);
  const pfTxt=f.precoFinalManual.value.trim();
  const dados={nome:f.nome.value.trim(),obs:f.obs.value.trim(),tempoMin:parseNum(f.tempoMin.value),lucroPct:parseNum(f.lucroPct.value),itens,precoFinalManual:pfTxt?parseNum(pfTxt):null};
  if(formProd.id){Object.assign(produtoById(formProd.id),dados);}else{db.produtos.push(Object.assign({id:uid('p')},dados));}
  saveDB();fecharModal();render();toast('Produto salvo.');return false;
}
function excluirProduto(id){
  if(!confirm('Excluir este produto? Orçamentos já salvos não serão afetados.'))return;
  db.produtos=db.produtos.filter(p=>p.id!==id);saveDB();render();toast('Produto excluído.');
}

/* ================= orçamentos e pedidos ================= */
let filtroOrc='todos',filtroPed='ativos';
function renderOrcamentos(){
  const lista=db.orcamentos.filter(o=>filtroOrc==='todos'||o.status===filtroOrc).sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));
  $('#view-orcamentos').innerHTML=`
    <div class="barra"><h2>Orçamentos</h2>
      <select id="selFiltroOrc">${['todos','aberto','aprovado','perdido'].map(s=>`<option value="${s}" ${s===filtroOrc?'selected':''}>${s==='todos'?'Todos':STATUS_ORC[s]}</option>`).join('')}</select>
      <div class="spacer"></div><button class="btn" onclick="abrirFormDoc('orcamento')">+ Novo orçamento</button>
    </div>
    <table class="grid"><thead><tr><th>Trabalho</th><th>Cliente</th><th>Data</th><th>Status</th><th class="num">Total</th><th></th></tr></thead>
    <tbody>${lista.length?lista.map(o=>`<tr>
      <td><button class="btn mini sec" onclick="verDoc('orcamento','${o.id}')">${esc(o.titulo||o.numero)}</button><div class="muted">${esc(o.numero)}</div></td>
      <td>${esc(o.cliente||'—')}</td><td>${fmtData(o.data)}</td>
      <td><span class="badge b-${o.status}">${STATUS_ORC[o.status]}</span></td>
      <td class="num"><strong>${fmtBRL(o.total)}</strong></td>
      <td class="num"><button class="btn mini neutro" onclick="verDoc('orcamento','${o.id}')">Ver orçamento</button></td></tr>`).join(''):'<tr><td colspan="6" class="muted">Nenhum orçamento nesta seleção.</td></tr>'}</tbody></table>`;
  $('#selFiltroOrc').setAttribute('aria-label','Filtrar orçamentos por situação');
  $('#selFiltroOrc').addEventListener('change',e=>{filtroOrc=e.target.value;render();});
}
function renderPedidos(){
  const lista=db.pedidos.filter(p=>{
    if(filtroPed==='ativos')return p.status!=='entregue'&&p.status!=='cancelado';
    if(filtroPed==='todos')return true;
    return p.status===filtroPed;
  }).sort((a,b)=>(a.prazo||'9999').localeCompare(b.prazo||'9999')||(b.criadoEm||'').localeCompare(a.criadoEm||''));
  $('#view-pedidos').innerHTML=`
    <div class="barra"><h2>Pedidos</h2>
      <select id="selFiltroPed">${[['ativos','Em andamento'],['todos','Todos os pedidos'],['pendente','A produzir'],['em_producao','Em produção'],['pronto','Prontos para entrega'],['entregue','Entregues'],['cancelado','Cancelados']].map(([v,l])=>`<option value="${v}" ${v===filtroPed?'selected':''}>${l}</option>`).join('')}</select>
      <div class="spacer"></div><button class="btn" onclick="abrirFormDoc('pedido')">+ Novo pedido</button>
    </div>
    <table class="grid"><thead><tr><th>Trabalho</th><th>Cliente</th><th>Entrega</th><th>Status</th><th class="num">Total</th><th></th></tr></thead>
    <tbody>${lista.length?lista.map(p=>`<tr>
      <td><button class="btn mini sec" onclick="verDoc('pedido','${p.id}')">${esc(p.titulo||p.numero)}</button><div class="muted">${esc(p.numero)}</div></td>
      <td>${esc(p.cliente||'—')}</td><td class="${p.prazo&&p.prazo<hojeISO()&&PROXIMO_PED[p.status]?'neg':''}">${p.prazo?fmtData(p.prazo):'<span class="muted">Sem prazo</span>'}</td>
      <td><span class="badge b-${p.status}">${STATUS_PED[p.status]}</span></td>
      <td class="num"><strong>${fmtBRL(p.total)}</strong></td>
      <td class="num">${PROXIMO_PED[p.status]?`<button class="btn mini sec" onclick="avancarPedido('${p.id}')">→ ${STATUS_PED[PROXIMO_PED[p.status]]}</button>`:''}
      <button class="btn mini neutro" onclick="verDoc('pedido','${p.id}')">Ver pedido</button></td></tr>`).join(''):'<tr><td colspan="6" class="muted">Nenhum pedido nesta seleção.</td></tr>'}</tbody></table>`;
  $('#selFiltroPed').setAttribute('aria-label','Filtrar pedidos por situação');
  $('#selFiltroPed').addEventListener('change',e=>{filtroPed=e.target.value;render();});
}

/* --- editor de orçamento/pedido --- */
let formDoc=null;
function abrirFormDoc(tipo,id){
  let d;
  if(id){
    const orig=(tipo==='orcamento'?db.orcamentos:db.pedidos).find(x=>x.id===id);
    d=JSON.parse(JSON.stringify(orig));
  }else{
    d={id:null,numero:null,titulo:'',data:hojeISO(),cliente:'',obs:'',prazo:'',itens:[],status:tipo==='orcamento'?'aberto':'pendente'};
  }
  formDoc={tipo,d};
  desenharFormDoc();
}
function totalDoc(d){return d.itens.reduce((s,i)=>s+(i.qtd*i.precoUnit),0);}
function capturaCabecalhoDoc(){
  const d=formDoc.d;
  const tit=$('#modal [name=titulo]'),cli=$('#modal [name=cliente]'),dat=$('#modal [name=data]'),obs=$('#modal [name=obs]'),prz=$('#modal [name=prazo]');
  if(tit)d.titulo=tit.value;if(cli)d.cliente=cli.value;if(dat)d.data=dat.value;if(obs)d.obs=obs.value;if(prz)d.prazo=prz.value;
}
function desenharFormDoc(){
  const {tipo,d}=formDoc;
  capturaCabecalhoDoc();
  const titulo=tipo==='orcamento'?'orçamento':'pedido';
  const prodOptions=db.produtos.map(p=>({id:p.id,rotulo:p.nome,extra:fmtBRL(precoFinal(p))}));
  const travado=tipo==='pedido'&&d.estoqueBaixado;
  const linhas=d.itens.map((it,idx)=>`<tr>
    <td>${esc(it.nome)}</td>
    <td style="width:90px"><input inputmode="decimal" value="${it.qtd}" data-idx="${idx}" class="docQtd" style="width:70px" ${travado?'disabled':''}></td>
    <td style="width:120px"><input inputmode="decimal" value="${(Math.round(it.precoUnit*100)/100).toFixed(2).replace('.',',')}" data-idx="${idx}" class="docPreco" style="width:105px" ${travado?'disabled':''}></td>
    <td class="num" id="subDoc${idx}">${fmtBRL(it.qtd*it.precoUnit)}</td>
    <td style="width:40px">${travado?'':`<button type="button" class="btn mini perigo" onclick="remItemDoc(${idx})">✕</button>`}</td></tr>`).join('');
  abrirModal(`<h3>${d.id?'Editar':'Novo'} ${titulo}${d.numero?' — '+esc(d.numero):''}</h3>
  <form onsubmit="return salvarDoc(event)">
    <div class="formgrid">
      <div class="campo largo"><label>Descrição do trabalho</label><input name="titulo" value="${esc(d.titulo||'')}" placeholder="Ex.: Kit festa · tema jardim · Maria" required></div>
      <div class="campo"><label>Cliente</label><input name="cliente" value="${esc(d.cliente||'')}" placeholder="Nome do cliente"></div>
      <div class="campo"><label>Data</label><input name="data" type="date" value="${d.data||hojeISO()}"></div>
      ${tipo==='pedido'?`<div class="campo"><label>Prazo de entrega</label><input name="prazo" type="date" value="${d.prazo||''}"></div>`:''}
      <div class="campo largo"><label>Detalhes da personalização</label><input name="obs" value="${esc(d.obs||'')}" placeholder="Nome, tema, cores e outros combinados"></div>
    </div>
    ${travado?'<p class="muted">O material deste pedido já saiu do estoque. Para mudar os itens, cancele este pedido e crie outro.</p>':`<div class="painel" style="background:color-mix(in srgb,var(--accent) 6%,var(--panel))">
      <div class="formgrid" style="margin-bottom:6px">
        <div class="campo largo"><label>Produto do catálogo</label>
          <div class="sug-wrap" id="wrapProdDoc"></div></div>
        <div class="campo" style="max-width:110px"><label>Quantidade</label><input id="qtdProdDoc" inputmode="decimal" value="1"></div>
      </div>
      <details><summary>Adicionar item fora do catálogo</summary>
        <div class="formgrid" style="margin-bottom:0">
          <div class="campo largo"><label>Descrição do item</label><input id="nomeAvulso" placeholder="Ex.: Arte personalizada para convite"></div>
          <div class="campo"><label>Quantidade</label><input id="qtdAvulso" inputmode="decimal" value="1"></div>
          <div class="campo"><label>Valor por unidade (R$)</label><input id="precoAvulso" inputmode="decimal" placeholder="0,00"></div>
          <div class="campo largo"><button type="button" class="btn neutro" onclick="addAvulsoDoc()">Adicionar item</button></div>
        </div>
      </details>
    </div>`}
    <table class="grid"><thead><tr><th>Item</th><th>Quantidade</th><th>Valor unitário</th><th class="num">Subtotal</th><th></th></tr></thead>
    <tbody id="tbDoc">${linhas||'<tr><td colspan="5" class="muted">Nenhum item ainda.</td></tr>'}</tbody></table>
    <div class="resumo-linha total"><span>Total</span><span id="totalDoc">${fmtBRL(totalDoc(d))}</span></div>
    <div class="acoes"><button class="btn" type="submit">Salvar ${titulo}</button><button class="btn neutro" type="button" onclick="fecharModal()">Cancelar</button></div>
  </form>`);
  $$('.docQtd').forEach(inp=>inp.addEventListener('input',()=>{const i=+inp.dataset.idx;formDoc.d.itens[i].qtd=parseNum(inp.value);atualizaLinhaDoc(i);}));
  $$('.docPreco').forEach(inp=>inp.addEventListener('input',()=>{const i=+inp.dataset.idx;formDoc.d.itens[i].precoUnit=parseNum(inp.value);atualizaLinhaDoc(i);}));
  montaSugestoes('#wrapProdDoc',prodOptions,prod=>addProdPorId(prod.id));
}
/* caixa de busca com lista de sugestões própria (navegável por teclado e mouse) */
function montaSugestoes(wrapSel,options,onPick){
  const wrap=$(wrapSel);if(!wrap)return;
  const material=wrapSel==='#wrapBuscaMat';
  wrap.innerHTML=`<input class="sug-input" aria-label="${material?'Buscar material':'Produto do catálogo'}" placeholder="${material?'Buscar material':'Buscar produto'}" autocomplete="off"><div class="sug-list"></div>`;
  const input=wrap.querySelector('.sug-input'),lista=wrap.querySelector('.sug-list');
  let foco=-1,itens=[];
  function desenhar(){
    const termo=input.value.trim().toLowerCase();
    itens=options.filter(o=>!termo||o.rotulo.toLowerCase().includes(termo)).slice(0,50);
    foco=itens.length?Math.max(0,Math.min(foco,itens.length-1)):-1;
    lista.innerHTML=itens.length?itens.map((o,i)=>`<button type="button" class="sug-item ${i===foco?'foco':''}" data-idx="${i}">
      <span>${esc(o.rotulo)}</span>${o.extra?`<span class="preco">${esc(o.extra)}</span>`:''}</button>`).join(''):
      `<div class="sug-item" style="cursor:default;color:var(--muted)">Nenhum ${material?'material':'produto'} encontrado</div>`;
    lista.classList.add('aberta');
  }
  function pick(i){
    const o=itens[i];if(!o)return;
    input.value='';lista.classList.remove('aberta');
    onPick(o);
  }
  input.addEventListener('input',()=>{foco=0;desenhar();});
  input.addEventListener('focus',desenhar);
  input.addEventListener('keydown',ev=>{
    if(!lista.classList.contains('aberta'))desenhar();
    if(ev.key==='ArrowDown'){ev.preventDefault();foco=Math.min(foco+1,itens.length-1);desenhar();}
    else if(ev.key==='ArrowUp'){ev.preventDefault();foco=Math.max(foco-1,0);desenhar();}
    else if(ev.key==='Enter'){ev.preventDefault();if(foco>=0)pick(foco);}
    else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();lista.classList.remove('aberta');}
  });
  lista.addEventListener('mousedown',ev=>{ev.preventDefault();const b=ev.target.closest('.sug-item[data-idx]');if(b)pick(+b.dataset.idx);});
  input.addEventListener('blur',()=>setTimeout(()=>lista.classList.remove('aberta'),150));
}
