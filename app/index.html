function salvarDoc(ev){
  ev.preventDefault();const f=ev.target;const{tipo,d}=formDoc;
  d.titulo=f.titulo.value.trim();
  d.cliente=f.cliente.value.trim();d.data=f.data.value||hojeISO();d.obs=f.obs.value.trim();
  if(tipo==='pedido'&&f.prazo)d.prazo=f.prazo.value||'';
  d.itens=d.itens.filter(i=>i.qtd>0);
  if(!d.itens.length){alert('Adicione pelo menos um item.');return false;}
  if(!d.titulo)d.titulo=d.itens[0].nome;
  if(tipo==='pedido'&&!d.estoqueBaixado){
    const faltas=faltasEstoque(d.itens);
    if(faltas.length&&!confirm('⚠ Estoque insuficiente:\n'+faltas.map(x=>`• ${x.nome}: precisa de ${fmtQtd(x.precisa)} ${x.un}, tem ${fmtQtd(x.tem)}`).join('\n')+'\n\nSalvar o pedido mesmo assim?'))return false;
  }
  d.total=totalDoc(d);
  if(tipo==='orcamento'){
    if(d.id){Object.assign(db.orcamentos.find(o=>o.id===d.id),d);}
    else{d.id=uid('o');d.numero='ORC-'+String(db.seq.orcamento++).padStart(4,'0');d.status='aberto';d.criadoEm=new Date().toISOString();db.orcamentos.push(d);}
  }else{
    if(d.id){Object.assign(db.pedidos.find(p=>p.id===d.id),d);}
    else{d.id=uid('pd');d.numero='PED-'+String(db.seq.pedido++).padStart(4,'0');d.status='pendente';d.criadoEm=new Date().toISOString();db.pedidos.push(d);}
  }
  saveDB();fecharModal();
  showView(tipo==='orcamento'?'orcamentos':'pedidos');
  toast((tipo==='orcamento'?'Orçamento ':'Pedido ')+d.numero+' salvo.');return false;
}

/* --- visualização/ações --- */
function verDoc(tipo,id){
  const d=(tipo==='orcamento'?db.orcamentos:db.pedidos).find(x=>x.id===id);if(!d)return;
  const ehOrc=tipo==='orcamento';
  const statusBadge=ehOrc?`<span class="badge b-${d.status}">${STATUS_ORC[d.status]}</span>`:`<span class="badge b-${d.status}">${STATUS_PED[d.status]}</span>`;
  const linhas=d.itens.map(i=>`<tr><td>${esc(i.nome)}</td><td class="num">${i.qtd}</td><td class="num">${fmtBRL(i.precoUnit)}</td><td class="num">${fmtBRL(i.qtd*i.precoUnit)}</td></tr>`).join('');
  let botoes='';
  if(ehOrc){
    if(d.status==='aberto'){
      botoes+=`<button class="btn" onclick="aprovarOrcamento('${d.id}')">✔ Aprovar e gerar pedido</button>
      <button class="btn neutro" onclick="statusOrcamento('${d.id}','perdido')">Marcar como não aprovado</button>`;
    }else if(d.status==='perdido'){
      botoes+=`<button class="btn sec" onclick="statusOrcamento('${d.id}','aberto')">Reabrir</button>`;
    }else if(d.status==='aprovado'){
      const ped=db.pedidos.find(p=>p.orcamentoId===d.id);
      if(ped)botoes+=`<button class="btn sec" onclick="fecharModal();verDoc('pedido','${ped.id}')">Ver pedido ${esc(ped.numero)}</button>`;
    }
    botoes+=`<button class="btn neutro" onclick="fecharModal();abrirFormDoc('orcamento','${d.id}')">Editar</button>
    <button class="btn sec" onclick="imprimirDoc('orcamento','${d.id}')">Imprimir / PDF</button>
    <button class="btn perigo" onclick="excluirDoc('orcamento','${d.id}')">Excluir</button>`;
  }else{
    if(PROXIMO_PED[d.status])botoes+=`<button class="btn" onclick="avancarPedido('${d.id}',true)">→ ${STATUS_PED[PROXIMO_PED[d.status]]}</button>`;
    if(d.status!=='cancelado'&&d.status!=='entregue')botoes+=`<button class="btn neutro" onclick="cancelarPedido('${d.id}')">Cancelar pedido</button>`;
    botoes+=`<button class="btn neutro" onclick="fecharModal();abrirFormDoc('pedido','${d.id}')">Editar</button>
    <button class="btn sec" onclick="imprimirDoc('pedido','${d.id}')">Imprimir / PDF</button>
    <button class="btn perigo" onclick="excluirDoc('pedido','${d.id}')">Excluir</button>`;
  }
  const prazoCampo=!ehOrc?`<div class="campo" style="max-width:200px;margin-top:10px"><label>Prazo de entrega</label><input type="date" value="${d.prazo||''}" onchange="salvarPrazo('${d.id}',this.value)"></div>`:'';
  abrirModal(`<h3>${ehOrc?'Orçamento':'Pedido'} ${esc(d.numero)} ${statusBadge}</h3>
    ${d.titulo?`<p style="font-size:1.05rem"><strong>${esc(d.titulo)}</strong></p>`:''}
    <p><strong>Cliente:</strong> ${esc(d.cliente||'—')} &nbsp; <strong>Data:</strong> ${fmtData(d.data)}${!ehOrc&&d.prazo?' &nbsp; <strong>Prazo:</strong> '+fmtData(d.prazo):''}</p>
    ${d.obs?`<p class="muted">${esc(d.obs)}</p>`:''}
    <table class="grid"><thead><tr><th>Item</th><th class="num">Quantidade</th><th class="num">Valor unitário</th><th class="num">Subtotal</th></tr></thead><tbody>${linhas}</tbody></table>
    <div class="resumo-linha total"><span>Total</span><span>${fmtBRL(d.total)}</span></div>
    ${prazoCampo}
    <div class="acoes">${botoes}<button class="btn neutro" onclick="fecharModal()">Fechar</button></div>`);
}
function statusOrcamento(id,st){const o=db.orcamentos.find(x=>x.id===id);o.status=st;saveDB();fecharModal();render();toast('Orçamento '+o.numero+': '+STATUS_ORC[st]);}
function aprovarOrcamento(id){
  const o=db.orcamentos.find(x=>x.id===id);
  const faltas=faltasEstoque(o.itens);
  if(faltas.length&&!confirm('⚠ Estoque insuficiente para este pedido:\n'+faltas.map(x=>`• ${x.nome}: precisa de ${fmtQtd(x.precisa)} ${x.un}, tem ${fmtQtd(x.tem)}`).join('\n')+'\n\nAprovar e gerar pedido mesmo assim?'))return;
  o.status='aprovado';
  const ped={id:uid('pd'),numero:'PED-'+String(db.seq.pedido++).padStart(4,'0'),orcamentoId:o.id,titulo:o.titulo,data:hojeISO(),cliente:o.cliente,obs:o.obs,itens:JSON.parse(JSON.stringify(o.itens)),total:o.total,status:'pendente',prazo:'',criadoEm:new Date().toISOString()};
  db.pedidos.push(ped);saveDB();fecharModal();showView('pedidos');
  toast('Orçamento aprovado. Pedido '+ped.numero+' criado.');
}
function avancarPedido(id,manterModal){
  const p=db.pedidos.find(x=>x.id===id);const prox=PROXIMO_PED[p.status];if(!prox)return;
  let extra='';
  if(prox==='em_producao'&&!p.estoqueBaixado){baixarEstoque(p);extra=' · estoque baixado';}
  p.status=prox;saveDB();
  if(manterModal){verDoc('pedido',id);}else{render();}
  toast('Pedido '+p.numero+': '+STATUS_PED[prox]+extra);
}
function cancelarPedido(id){
  const p=db.pedidos.find(x=>x.id===id);
  if(!confirm('Cancelar o pedido '+p.numero+'?'))return;
  if(p.estoqueBaixado&&confirm('Este pedido já baixou estoque. Devolver os materiais ao estoque?'))estornarEstoque(p);
  p.status='cancelado';saveDB();fecharModal();render();toast('Pedido cancelado.');
}
function salvarPrazo(id,v){const p=db.pedidos.find(x=>x.id===id);p.prazo=v;saveDB();render();}
function excluirDoc(tipo,id){
  const alvo=tipo==='orcamento'?db.orcamentos.find(o=>o.id===id):db.pedidos.find(p=>p.id===id);
  if(tipo==='pedido'&&alvo&&alvo.estoqueBaixado){
    if(!confirm('Este pedido já baixou estoque. Excluir e devolver os materiais ao estoque?'))return;
    estornarEstoque(alvo);
  }else if(!confirm('Excluir definitivamente?'))return;
  if(tipo==='orcamento')db.orcamentos=db.orcamentos.filter(o=>o.id!==id);
  else db.pedidos=db.pedidos.filter(p=>p.id!==id);
  saveDB();fecharModal();render();toast('Excluído.');
}

function exportarBackup(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='papelaria-backup-'+hojeISO()+'.json';a.click();URL.revokeObjectURL(a.href);
  toast('Backup exportado.');

function importarBackup(inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const obj=JSON.parse(reader.result);
      const dados=normalizarArquivoSync(obj).dados;
      const nArq=(dados.orcamentos||[]).length,nLoc=(db.orcamentos||[]).length;
      let msg='Importar vai substituir TODOS os dados atuais.\n\n';
      if(dados.atualizadoEm)msg+='Salvo em: '+new Date(dados.atualizadoEm).toLocaleString('pt-BR')+'\n';
      msg+=`\nArquivo: ${nArq} orçamentos · Atual: ${nLoc} orçamentos.\n\nContinuar?`;
      if(!confirm(msg))return;
      db=dados;
      migrarDB(false);saveDB();render();toast('Dados importados do arquivo.');
    }catch(e){alert('Arquivo inválido: '+e.message);}
  };
  reader.readAsText(file);inp.value='';

/* ================= sincronização entre dispositivos =================
   Nuvem gratuita (Supabase): funciona no Safari/iPhone e no PC.
   Arquivo vinculado: alternativa em navegadores com File System Access.
   Leituras não criam revisões. Alterações offline ficam pendentes.
*/
let syncHandle=null;
let syncAutorizado=false;
let syncBusy=false;
let syncErro='';
let ultimoSync=null;
let aplicandoSync=false;
let syncConflito=null;
let syncAdiado=false;
let syncPromessa=null;
let syncRepetir=false;
let syncTimer=null;
let syncDebounce=null;
const SYNC_DB_KEY='papelariaSyncDB';
const SYNC_STATE_KEY='papelariaSyncEstado';
const CLOUD_KEY='papelariaNuvem';
const SYNC_POLL_MS=30000;
let syncEstado={origem:'',base:null,pendente:false,versao:0,ultimoEnvio:null};
let nuvem=null;
try{
  const salvo=JSON.parse(localStorage.getItem(SYNC_STATE_KEY)||'null');
  if(salvo&&typeof salvo==='object')Object.assign(syncEstado,salvo);
  const config=JSON.parse(localStorage.getItem(CLOUD_KEY)||'null');
  if(config){validarConexaoNuvem(config.url,config.key);nuvem=config;}
}catch(e){console.warn('Configuração de sincronização indisponível.');}

function nuvemAtiva(){return !!(nuvem&&nuvem.session&&nuvem.session.user);}
function temOrigemSync(){return nuvemAtiva()||!!syncHandle;}
function salvarEstadoSync(){
  try{localStorage.setItem(SYNC_STATE_KEY,JSON.stringify(syncEstado));}catch(e){console.warn(e);}
}
function selecionarOrigemSync(){
  const origem=nuvemAtiva()?'nuvem:'+nuvem.url+':'+nuvem.session.user.id:'arquivo';
  if(syncEstado.origem!==origem){
    syncEstado.origem=origem;syncEstado.base=null;syncEstado.versao=0;syncEstado.ultimoEnvio=null;
    syncConflito=null;salvarEstadoSync();
  }
}
function statusSync(){
  if(syncBusy)return 'Sincronizando…';
  if(syncConflito)return 'Escolha os dados que deseja manter';
  if(nuvemAtiva()&&nuvem.precisaLogin)return 'Entre novamente para sincronizar';
  if(!nuvemAtiva()&&syncHandle&&!syncAutorizado)return 'Toque em Atualizar para autorizar';
  if(syncErro)return 'Não foi possível sincronizar';
  if(syncAdiado)return 'Dados novos disponíveis. Conclua o formulário para atualizar.';
  if(!temOrigemSync())return 'Nuvem não conectada';
  if(syncEstado.pendente)return 'Alterações aguardando envio';
  if(!nuvemAtiva()&&syncHandle)return 'Arquivo vinculado. Nuvem ainda não conectada.';
  return ultimoSync?'Atualizado':'Aguardando primeira atualização';
}
function atualizaSyncBtn(){
  const b=$('#btnSync');if(!b)return;
  const arquivo=!nuvemAtiva()&&!!syncHandle;
  b.textContent=syncBusy?(arquivo?'📁 …':'☁️ …'):syncConflito?'☁️ Resolver':
    (nuvemAtiva()&&nuvem.precisaLogin)?'☁️ Entrar':
    !temOrigemSync()?'☁️ Conectar':syncErro?'☁️ Tentar novamente':
    syncEstado.pendente?(arquivo?'📁 Salvar arquivo':'☁️ Enviar'):
    arquivo?'📁 Atualizar arquivo':'☁️ Atualizar';
  b.title=statusSync()+(ultimoSync?' · '+ultimoSync.toLocaleTimeString('pt-BR'):'');
  b.setAttribute('aria-label',b.title);
  const status=$('#syncStatus');if(status)status.textContent=statusSync();
  const configStatus=$('#configSyncStatus');if(configStatus)configStatus.textContent=statusSync();
}
function assinaturaDados(dados){
  // O PostgreSQL/jsonb pode devolver as propriedades em outra ordem.
  return JSON.stringify(dados,(_k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?
    Object.fromEntries(Object.keys(v).sort().map(k=>[k,v[k]])):v);
}
function normalizarArquivoSync(obj){
  const dados=obj&&obj.dados?obj.dados:obj;
  if(!dados||!Array.isArray(dados.materiais)||!Array.isArray(dados.produtos)||
    !Array.isArray(dados.orcamentos)||!Array.isArray(dados.pedidos)||
    !dados.config||!Array.isArray(dados.config.custosFixos)||!dados.seq){
    throw new Error('O arquivo não contém dados válidos da PriArte.');
  }
  return {dados,rev:dados.rev||obj.rev||0,atualizadoEm:dados.atualizadoEm||obj.atualizadoEm||null};
}
function payloadSync(){return {app:'PriArte Ateliê',rev:db.rev||0,atualizadoEm:db.atualizadoEm||null,dados:db};}
function registrarAlteracaoSync(){
  syncEstado.pendente=true;salvarEstadoSync();atualizaSyncBtn();
  if(!temOrigemSync())return;
  syncRepetir=true;
  clearTimeout(syncDebounce);
  syncDebounce=setTimeout(()=>checarAtualizacaoRemota(true),400);
}
function aplicarDadosRemotos(remoto){
  aplicandoSync=true;
  try{db=remoto.dados;migrarDB(false);persistirDB();}finally{aplicandoSync=false;}
  render();
}
function editandoFormulario(){
  return !!($('#overlay.aberto form')||$('form[data-sync-editando="1"]'));
}
function marcarFormularioEditado(ev){
  const alvo=ev.target||ev;
  const form=alvo.closest&&alvo.closest('form');
  if(form)form.dataset.syncEditando='1';
}
document.addEventListener('input',marcarFormularioEditado);
document.addEventListener('change',marcarFormularioEditado);

/* Permissão do arquivo é solicitada apenas a partir de um clique. */
function dbSyncOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(SYNC_DB_KEY,1);
    r.onupgradeneeded=()=>r.result.createObjectStore('cfg');
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error('Feche outra aba do app e tente novamente.'));
  });
}
async function dbSyncGet(k){
  let d;
  try{d=await dbSyncOpen();return await new Promise((res,rej)=>{
    const r=d.transaction('cfg').objectStore('cfg').get(k);
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });}catch(e){return undefined;}finally{if(d)d.close();}
}
async function dbSyncSet(k,v){
  const d=await dbSyncOpen();
  try{await new Promise((res,rej)=>{
    const t=d.transaction('cfg','readwrite');
    if(v===undefined)t.objectStore('cfg').delete(k);else t.objectStore('cfg').put(v,k);
    t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });}finally{d.close();}
}
async function carregarHandleSync(){
  if(nuvemAtiva()){
    selecionarOrigemSync();iniciarSyncAuto();await checarAtualizacaoRemota(true);return;
  }
  if(nuvem){syncHandle=null;syncAutorizado=false;atualizaSyncBtn();return;}
  syncHandle=await dbSyncGet('handle')||null;
  if(syncHandle){
    selecionarOrigemSync();
    try{syncAutorizado=await syncHandle.queryPermission({mode:'readwrite'})==='granted';}
    catch(e){syncErro='Toque em Atualizar para autorizar o arquivo.';}
    if(syncAutorizado){iniciarSyncAuto();await checarAtualizacaoRemota(true);}
  }
  atualizaSyncBtn();
}
async function sincronizarAgora(){
  if(syncBusy)return syncPromessa;
  if(syncConflito){abrirConflitoSync();return;}
  if(!temOrigemSync()||(nuvemAtiva()&&nuvem.precisaLogin)){abrirSync();return;}
  if(!nuvemAtiva()&&!syncAutorizado){
    try{
      syncAutorizado=await syncHandle.requestPermission({mode:'readwrite'})==='granted';
      if(!syncAutorizado){toast('Autorize o arquivo para atualizar.');return;}
      syncErro='';iniciarSyncAuto();
    }catch(e){syncErro='Não foi possível autorizar o arquivo.';atualizaSyncBtn();toast(syncErro);return;}
  }
  await checarAtualizacaoRemota(false);
  if(syncConflito)abrirConflitoSync();
  else if(syncErro)abrirSync();
}
async function escolherArquivoSync(novo){
  if(syncBusy)return;
  if(nuvemAtiva()){toast('Desconecte a nuvem antes de vincular um arquivo.');return;}
  if(!('showOpenFilePicker' in window)){abrirSync();return;}
  try{
    const opcoes={id:'priarte-dados',types:[{description:'Dados da PriArte',accept:{'application/json':['.json']}}]};
    if(syncHandle)opcoes.startIn=syncHandle;
    const handle=novo&&window.showSaveFilePicker?
      await window.showSaveFilePicker({...opcoes,suggestedName:'papelaria-dados.json'}):
      (await window.showOpenFilePicker({...opcoes,multiple:false}))[0];
    const permissao=await handle.requestPermission({mode:'readwrite'});
    if(permissao!=='granted')throw new Error('Autorize a leitura e gravação do arquivo.');
    const texto=await (await handle.getFile()).text();
    const remoto=texto.trim()?normalizarArquivoSync(JSON.parse(texto)):null;
    if(!novo&&!remoto)throw new Error('O arquivo está vazio.');
    if(remoto&&syncEstado.pendente&&assinaturaDados(db)!==assinaturaDados(remoto.dados)&&
      !confirm('Carregar este arquivo substituirá as alterações deste aparelho. Continuar?'))return;
    await dbSyncSet('handle',handle);
    nuvem=null;localStorage.removeItem(CLOUD_KEY);
    syncHandle=handle;syncAutorizado=true;syncConflito=null;syncErro='';
    syncEstado={origem:'arquivo',base:remoto?assinaturaDados(remoto.dados):null,pendente:!remoto,versao:0};
    if(remoto)aplicarDadosRemotos(remoto);
    salvarEstadoSync();iniciarSyncAuto();fecharModal();
    await checarAtualizacaoRemota(false);
  }catch(e){if(e.name!=='AbortError'){syncErro=e.message;toast(syncErro);}}
  atualizaSyncBtn();
}
function vincularArquivoExistente(){return escolherArquivoSync(false);}
function vincularArquivoSync(){return escolherArquivoSync(true);}
async function lerArquivoSync(){
  const texto=await (await syncHandle.getFile()).text();
  return texto.trim()?normalizarArquivoSync(JSON.parse(texto)):null;
}

/* Supabase REST: sem bibliotecas externas, senha nunca é guardada. */
function validarConexaoNuvem(url,key){
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url||'')){
    throw new Error('Informe a URL do projeto: https://seu-projeto.supabase.co');
  }
  let publica=(key||'').startsWith('sb_publishable_');
  if(!publica){
    try{publica=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role==='anon';}catch(e){}
  }
  if(!publica)throw new Error('Use a chave pública publishable ou anon do projeto.');
}
function guardarNuvem(){localStorage.setItem(CLOUD_KEY,JSON.stringify(nuvem));}
async function requisicaoNuvem(config,caminho,{method='GET',body,token}={}){
  const controlador=new AbortController();
  const timer=setTimeout(()=>controlador.abort(),15000);
  try{
    const headers={apikey:config.key,'Content-Type':'application/json'};
    if(token)headers.Authorization='Bearer '+token;
    const res=await fetch(config.url+caminho,{method,headers,cache:'no-store',
      signal:controlador.signal,body:body===undefined?undefined:JSON.stringify(body)});
    const texto=await res.text();let resposta=null;
    try{resposta=texto?JSON.parse(texto):null;}catch(e){}
    if(!res.ok){
      let mensagem=resposta&&(resposta.msg||resposta.message||resposta.error_description);
      if(res.status===401)mensagem='Entre novamente para sincronizar.';
      if(res.status===404)mensagem='Conclua a configuração da nuvem com o arquivo supabase-sync.sql.';
      const erro=new Error(mensagem||'A nuvem está indisponível. Tente novamente.');
      erro.status=res.status;erro.code=resposta&&resposta.code;throw erro;
    }
    return resposta;
  }catch(e){
    if(e.name==='AbortError'||e instanceof TypeError)throw new Error('Sem conexão com a nuvem. As alterações ficam neste aparelho.');
    throw e;
  }finally{clearTimeout(timer);}
}
function guardarSessao(sessao){
  if(!sessao||!sessao.access_token||!sessao.refresh_token||!sessao.user)throw new Error('Não foi possível entrar.');
  nuvem.session={access_token:sessao.access_token,refresh_token:sessao.refresh_token,
    expires_at:sessao.expires_at||Math.floor(Date.now()/1000)+(sessao.expires_in||3600),user:sessao.user};
  nuvem.precisaLogin=false;guardarNuvem();
}
async function renovarSessaoNuvem(forcar=false){
  const renovar=async()=>{
    const salva=JSON.parse(localStorage.getItem(CLOUD_KEY)||'null');
    if(salva&&salva.url===nuvem.url&&salva.session&&salva.session.user.id===nuvem.session.user.id)nuvem.session=salva.session;
    if(!forcar&&nuvem.session.expires_at>Date.now()/1000+60)return;
    try{
      guardarSessao(await requisicaoNuvem(nuvem,'/auth/v1/token?grant_type=refresh_token',
        {method:'POST',body:{refresh_token:nuvem.session.refresh_token}}));
    }catch(e){
      if(e.status===400||e.status===401||e.status===403){
        nuvem.precisaLogin=true;guardarNuvem();throw new Error('Entre novamente para sincronizar.');
      }
      throw e;
    }
  };
  if(navigator.locks)return navigator.locks.request('papelaria-renovar-sessao',renovar);
  return renovar();
}
async function apiNuvem(caminho,opcoes={}){
  if(nuvem.precisaLogin)throw new Error('Entre novamente para sincronizar.');
  await renovarSessaoNuvem();
  try{return await requisicaoNuvem(nuvem,caminho,{...opcoes,token:nuvem.session.access_token});}
  catch(e){
    if(e.status!==401)throw e;
    await renovarSessaoNuvem(true);
    try{return await requisicaoNuvem(nuvem,caminho,{...opcoes,token:nuvem.session.access_token});}
    catch(erro){
      if(erro.status===401){nuvem.precisaLogin=true;guardarNuvem();}
      throw erro;
    }
  }
}
async function conectarNuvem(ev){
  ev.preventDefault();if(syncBusy)return false;
  const f=ev.target,b=f.querySelector('button[type=submit]'),erro=f.querySelector('[role=alert]');
  b.disabled=true;erro.textContent='';
  try{
    const config={url:f.url.value.trim().replace(/\/$/,''),key:f.chave.value.trim()};
    validarConexaoNuvem(config.url,config.key);
    const sessao=await requisicaoNuvem(config,'/auth/v1/token?grant_type=password',
      {method:'POST',body:{email:f.email.value.trim(),password:f.senha.value}});
    if(syncPromessa)await syncPromessa;
    nuvem=config;guardarSessao(sessao);f.senha.value='';
    syncHandle=null;syncAutorizado=false;
    selecionarOrigemSync();syncErro='';syncConflito=null;
    iniciarSyncAuto();fecharModal();await checarAtualizacaoRemota(false);
    if(syncConflito)abrirConflitoSync();
  }catch(e){erro.textContent=e.message;}finally{b.disabled=false;}
  return false;
}
async function lerOrigemSync(){
  if(!nuvemAtiva())return lerArquivoSync();
  const linhas=await apiNuvem('/rest/v1/papelaria_sync?select=version,payload,updated_at&user_id=eq.'+
    encodeURIComponent(nuvem.session.user.id)+'&limit=1');
  if(!Array.isArray(linhas))throw new Error('Resposta inválida da nuvem.');
  if(!linhas.length)return null;
  return {...normalizarArquivoSync(linhas[0].payload),versao:linhas[0].version};
}
async function escreverOrigemSync(payload,versao){
  if(nuvemAtiva()){
    const linhas=await apiNuvem('/rest/v1/rpc/salvar_papelaria',{method:'POST',
      body:{p_versao:versao,p_payload:payload}});
    if(!Array.isArray(linhas)||!linhas[0])throw new Error('A nuvem não confirmou o envio.');
    return linhas[0].version;
  }
  const w=await syncHandle.createWritable();
  try{await w.write(JSON.stringify(payload));await w.close();}
  catch(e){try{await w.abort();}catch(ignorado){}throw e;}
  return 0;
}

/* Uma operação por vez; um novo save durante o envio entra na próxima rodada. */
function checarAtualizacaoRemota(silencioso=true){
  if(!temOrigemSync()||(!nuvemAtiva()&&!syncAutorizado))return Promise.resolve();
  if(syncPromessa){syncRepetir=true;return syncPromessa;}
  if(syncConflito)return Promise.resolve();
  syncBusy=true;atualizaSyncBtn();
  syncPromessa=(async()=>{
    try{
      let conflitosDeGravacao=0;
      do{
        syncRepetir=false;
        selecionarOrigemSync();
        const remoto=await lerOrigemSync();
        syncAdiado=false;syncErro='';
        const assinaturaRemota=remoto?assinaturaDados(remoto.dados):null;
        const assinaturaLocal=assinaturaDados(db);
        if(remoto&&assinaturaLocal===assinaturaRemota){
          syncEstado.base=assinaturaRemota;syncEstado.versao=remoto.versao||0;syncEstado.pendente=false;
        }else if(remoto&&assinaturaRemota!==syncEstado.base){
          if(syncEstado.pendente){
            syncConflito=remoto;toast('Há alterações nos dois aparelhos. Toque em Resolver.');break;
          }
          if(editandoFormulario()){
            syncAdiado=true;
            if(!silencioso)toast('Há dados novos. Conclua ou feche o formulário para carregar.');
            break;
          }
          aplicarDadosRemotos(remoto);
          syncEstado.base=assinaturaRemota;syncEstado.versao=remoto.versao||0;
        }else if(syncEstado.pendente||!remoto){
          if(!remoto&&syncEstado.base!==null)throw new Error('Os dados sincronizados não foram encontrados. Sua cópia local foi mantida.');
          const payload=JSON.parse(JSON.stringify(payloadSync()));
          const enviado=assinaturaDados(payload.dados);
          try{syncEstado.versao=await escreverOrigemSync(payload,remoto?remoto.versao||0:0);}
          catch(e){
            if(e.status===409&&++conflitosDeGravacao<=3){syncRepetir=true;continue;}
            throw e;
          }
          syncEstado.base=enviado;
          syncEstado.ultimoEnvio=new Date().toISOString();
          syncEstado.pendente=assinaturaDados(db)!==enviado;
          if(syncEstado.pendente)syncRepetir=true;
        }
        ultimoSync=new Date();syncErro='';salvarEstadoSync();
      }while(syncRepetir&&!syncConflito);
      if(!silencioso&&!syncConflito&&!editandoFormulario())toast('Dados atualizados.');
    }catch(e){
      syncErro=e.message||'Não foi possível sincronizar.';
      if(!nuvemAtiva()&&(e.name==='NotAllowedError'||e.name==='SecurityError'))syncAutorizado=false;
      if(!silencioso)toast(syncErro);
    }finally{syncBusy=false;syncPromessa=null;atualizaSyncBtn();}
  })();
  return syncPromessa;
}
function iniciarSyncAuto(){
  clearInterval(syncTimer);
  syncTimer=setInterval(()=>{if(!document.hidden)checarAtualizacaoRemota(true);},SYNC_POLL_MS);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checarAtualizacaoRemota(true);});
window.addEventListener('focus',()=>checarAtualizacaoRemota(true));
window.addEventListener('pageshow',()=>checarAtualizacaoRemota(true));
window.addEventListener('online',()=>checarAtualizacaoRemota(true));

    <div class="acoes">
      <button class="btn" onclick="resolverConflitoSync('remoto')">Usar dados ${nuvemAtiva()?'da nuvem':'do arquivo'}</button>

      <button class="btn neutro" onclick="baixarCopiaDados()">Baixar cópia deste aparelho</button>
    </div>`);
}
async function resolverConflitoSync(escolha){
  if(!syncConflito||syncBusy)return;
  const remoto=syncConflito;
  if(escolha==='remoto'){
    // Guarda também a cópia anterior no dispositivo, antes da substituição.
    try{localStorage.setItem('papelariaAntesDaTroca',JSON.stringify(payloadSync()));}
    catch(e){toast('Baixe uma cópia deste aparelho antes de substituir os dados.');return;}
    aplicarDadosRemotos(remoto);syncEstado.pendente=false;
  }else syncEstado.pendente=true;
  syncEstado.base=assinaturaDados(remoto.dados);syncEstado.versao=remoto.versao||0;
  syncConflito=null;syncErro='';salvarEstadoSync();fecharModal();
  await checarAtualizacaoRemota(false);
}

async function desconectarNuvem(){

/* ================= instalação do app =================
   Manifest embutido; sw.js fornece o cache offline em HTTPS/localhost. */
function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function isSafari(){return /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent);}
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();deferredInstall=ev;});

    deferredInstall?'Toque em Instalar agora.':'No Chrome, abra o menu ⋮ e escolha <strong>Adicionar à tela inicial</strong>.']};

function aplicaTema(t){
  document.body.classList.toggle('claro',t==='claro');
  const b=$('#btnTema');if(b)b.textContent=t==='claro'?'Usar tema escuro':'Usar tema claro';
  try{localStorage.setItem('papelariaTema',t);}catch(e){}
}
function toggleTema(){aplicaTema(document.body.classList.contains('claro')?'escuro':'claro');}

/* ================= init ================= */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
}
loadDB();
migrarDB();
$('#logoImg').src=LOGO;
instalarPWA();
let temaIni='escuro';
try{temaIni=localStorage.getItem('papelariaTema')||'escuro';}catch(e){}
aplicaTema(temaIni);
showView('dashboard');
atualizaSyncBtn();
atualizaBtnInstalar();
carregarHandleSync();
try{localStorage.setItem('papelariaVersao',APP_VERSAO);}catch(e){}
</script>
</body>
</html>
